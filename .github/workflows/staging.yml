name: CI

# Build e testes são o gate da `main`. Os deploys são feitos pelas integrações
# Git nativas de cada provedor: Cloudflare Pages para o frontend e Render para
# a API. Isso evita credenciais e deploy hooks de infra antiga no GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fazendinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d fazendinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fazendinha_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/fazendinha_test
      AUTH_DB_INTEGRATION: "1"
      FINANCE_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lê packageManager (pnpm@10.7.1) do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client é necessário pro tsc build (não conecta ao banco).
      - run: pnpm --filter rionovo-server exec prisma generate
      - name: Build (server + client)
        run: pnpm -r run build
      - name: Preparar banco isolado dos testes
        run: pnpm --filter rionovo-server exec prisma db push --skip-generate
      - name: Testes (server)
        run: pnpm --filter rionovo-server test

  financeiro-integration:
    name: financeiro (bateria de invariantes, banco real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fazendinha
          POSTGRES_PASSWORD: fazendinha
          POSTGRES_DB: fazendinha_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fazendinha -d fazendinha_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # scripts/qa-financeiro.mjs exige esse nome de banco e host local — ele
      # cria um schema efêmero por execução (isolado do fazendinha_local "de
      # verdade" que dev usa) e derruba só esse schema ao final.
      DATABASE_URL: postgresql://fazendinha:fazendinha@localhost:5432/fazendinha_local
      DIRECT_URL: postgresql://fazendinha:fazendinha@localhost:5432/fazendinha_local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lê packageManager (pnpm@10.7.1) do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rionovo-server exec prisma generate
      # O script roda com `node --env-file=.env`; no runner o arquivo não existe.
      - run: printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$DATABASE_URL" "$DIRECT_URL" > server/.env
      # O script aplica as migrations (prisma migrate deploy) dentro do schema
      # efêmero que ele mesmo cria antes de rodar a bateria.
      - name: Bateria de invariantes do financeiro (banco real)
        run: pnpm --filter rionovo-server run test:financeiro:integration
