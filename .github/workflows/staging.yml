name: CI

# Build e testes são o gate da `main`. Os deploys são feitos pelas integrações
# Git nativas de cada provedor: Cloudflare Pages para o frontend e Render para
# a API. Isso evita credenciais e deploy hooks de infra antiga no GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lê packageManager (pnpm@10.7.1) do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client é necessário pro tsc build (não conecta ao banco).
      - run: pnpm --filter rionovo-server exec prisma generate
      - name: Build (server + client)
        run: pnpm -r run build
      - name: Testes (server)
        # Testes unitários (não conectam ao banco), mas importam módulos que passam
        # por env.ts — que aborta (process.exit) se DATABASE_URL faltar. No CI não há
        # server/.env, então injetamos uma URL dummy só pra validação passar.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm --filter rionovo-server test
