name: CI

# Testes aprovados liberam a publicação: staging → STG; main → produção.
# Produção depende também da aprovação do environment após homologação no STG.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Nunca interromper migrations/publicação em andamento por um novo push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fazendinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d fazendinha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fazendinha_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/fazendinha_test
      AUTH_DB_INTEGRATION: "1"
      FINANCE_DB_INTEGRATION: "1"
      PECUARIA_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lê packageManager (pnpm@10.7.1) do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client é necessário pro tsc build (não conecta ao banco).
      - run: pnpm --filter rionovo-server exec prisma generate
      - name: Build (server + client)
        run: pnpm -r run build
      - name: Testes do transformador da carga da pecuária (scripts/*.test.mjs)
        run: node --test scripts/*.test.mjs server/scripts/consolidacao-sitios-local/modelo.test.mjs
      - name: Verificar contratos da carga e seed unificada
        run: |
          pnpm --filter rionovo-server run import:pecuaria:v4:typecheck
          pnpm --filter rionovo-server run import:pecuaria:stg:typecheck
          pnpm --filter rionovo-server run seed:typecheck
      - name: Testes da interface
        run: pnpm --filter rionovo-client exec vitest run --fileParallelism=false
      # migrate deploy (e não db push): os índices únicos parciais da pecuária ("uma linha
      # aberta por animal") e as categorias padrão só existem no SQL da migration da
      # pecuária v1 — db push os apagaria e o banco de teste divergiria do de produção.
      - name: Preparar banco isolado dos testes
        run: pnpm --filter rionovo-server exec prisma migrate deploy
      - name: Testes (server)
        run: pnpm --filter rionovo-server test
      - name: Testes da carga técnica V4
        run: pnpm --filter rionovo-server run test:import:pecuaria:v4
      - name: Testes da conciliação histórica STG
        run: pnpm --filter rionovo-server run test:import:pecuaria:stg

  financeiro-integration:
    name: financeiro (bateria de invariantes, banco real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fazendinha
          POSTGRES_PASSWORD: fazendinha
          POSTGRES_DB: fazendinha_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fazendinha -d fazendinha_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # scripts/qa-financeiro.mjs exige esse nome de banco e host local — ele
      # cria um banco temporário por execução (isolado do fazendinha_local "de
      # verdade" que dev usa) e o apaga ao final.
      DATABASE_URL: postgresql://fazendinha:fazendinha@localhost:5432/fazendinha_local
      DIRECT_URL: postgresql://fazendinha:fazendinha@localhost:5432/fazendinha_local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lê packageManager (pnpm@10.7.1) do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rionovo-server exec prisma generate
      # O script roda com `node --env-file=.env`; no runner o arquivo não existe.
      - run: printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$DATABASE_URL" "$DIRECT_URL" > server/.env
      # O script aplica as migrations (prisma migrate deploy) no banco
      # temporário que ele mesmo cria antes de rodar a bateria.
      - name: Bateria de invariantes do financeiro (banco real)
        run: pnpm --filter rionovo-server run test:financeiro:integration

  seed-unificada:
    name: baseline + seed unificada (retomada e idempotência)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fazendinha_seedatev3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d fazendinha_seedatev3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fazendinha_seedatev3
      DIRECT_URL: postgresql://ci:ci@localhost:5432/fazendinha_seedatev3
      NODE_ENV: test
      R2_ACCOUNT_ID: seed-ci-inerte
      R2_ACCESS_KEY_ID: seed-ci-inerte
      R2_SECRET_ACCESS_KEY: seed-ci-inerte
      R2_BUCKET_NOTAS: seed-ci-inerte
      STORAGE_NAMESPACE: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rionovo-server exec prisma generate
      - run: printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$DATABASE_URL" "$DIRECT_URL" > server/.env
      - run: pnpm --filter rionovo-server exec prisma migrate deploy
      - run: pnpm --filter rionovo-server run seed --preflight
      - name: Interromper após estoque e retomar
        run: |
          node --test server/scripts/substituir-base-local.test.mjs
          if pnpm --filter rionovo-server run seed --interromper-apos=estoque > /tmp/seed-interrupcao.log 2>&1; then
            cat /tmp/seed-interrupcao.log
            echo "A interrupção esperada não ocorreu"; exit 1
          fi
          cat /tmp/seed-interrupcao.log
          grep --fixed-strings --line-regexp '[seed] Interrupção de teste após estoque; execute novamente para retomar.' /tmp/seed-interrupcao.log
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const manifesto = JSON.parse(readFileSync('server/.seed/manifesto.json', 'utf8'));
          if (!Array.isArray(manifesto.etapas) || !manifesto.etapas.includes('estoque')) {
            throw new Error('A interrupção não concluiu a etapa estoque no manifesto.');
          }
          JS
          pnpm --filter rionovo-server run seed
      - name: Verificar e reexecutar sem duplicação
        run: |
          pnpm --filter rionovo-server run seed --verificar
          node --env-file=server/.env server/scripts/fingerprint-seed.mjs > /tmp/seed-antes.json
          pnpm --filter rionovo-server run seed
          node --env-file=server/.env server/scripts/fingerprint-seed.mjs > /tmp/seed-depois.json
          diff -u /tmp/seed-antes.json /tmp/seed-depois.json

  deploy:
    name: deploy (${{ github.ref_name == 'main' && 'producao' || 'staging' }})
    needs: [ci, financeiro-integration, seed-unificada]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'producao' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://fazendinha-producao.somosvirasudo.workers.dev' || 'https://fazendinha-stg.somosvirasudo.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rionovo-server exec prisma generate
      - run: pnpm cf:build
      - name: Aplicar migrations, publicar e conferir versão
        env:
          DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'producao' || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: '1148b69b1e1518155a8dd0cf91929ebf'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WORKERS_CI_BUILD_UUID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: sh scripts/cf-deploy.sh "$DEPLOY_TARGET"
