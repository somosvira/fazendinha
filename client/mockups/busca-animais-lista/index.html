<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposta — Busca de animais com lista</title><style>
@font-face{font-family:Public;src:url('/fonts/public-sans/public-sans-latin-wght-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#263e3b;font:14px Public,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #006f68;outline-offset:3px}button{color:inherit;background:white;border:1px solid #dfe7e5;border-radius:7px;padding:9px 13px}button:hover{background:#edf5f3}.demo{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid #dfe7e5;font-size:12px}.demo strong{font-weight:650}.demo div{display:flex;gap:8px;align-items:center}.demo button{padding:6px 10px;font-size:12px}.bg{padding:32px 44px}.bg h1{font-size:26px}.bg nav{border-bottom:1px solid #dfe7e5;padding:12px 0}.background-card{border:1px solid #dfe7e5;border-radius:12px;background:white;padding:24px;margin-top:24px;height:180px}.veil{position:fixed;inset:56px 0 0;background:rgba(32,60,57,.34);display:grid;place-items:center;padding:24px}.modal{width:min(1200px,100%);height:min(740px,calc(100dvh - 110px));display:flex;flex-direction:column;background:#fff;border:1px solid #dfe7e5;border-radius:12px;overflow:hidden;box-shadow:0 20px 70px #1f393930}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px 14px}.header h2{font-size:22px;margin:0 0 6px;letter-spacing:-.025em}.header p{font-size:13px;color:#526863;margin:0}.close{width:40px;height:40px;padding:0;display:grid;place-items:center;border:0;font-size:25px;background:transparent}.filters{display:grid;grid-template-columns:minmax(250px,2fr) repeat(3,minmax(130px,1fr)) auto;gap:12px;align-items:end;padding:8px 24px 18px;border-bottom:1px solid #dfe7e5}label{display:grid;gap:7px;font-size:13px}.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid #7a928d;height:42px}.search:focus-within{border-bottom:2px solid #006f68}.search svg{color:#006f68;flex-shrink:0}.search input{width:100%;min-width:0;border:0;background:transparent;outline:none;padding:10px 0;font-size:15px;color:#263e3b}.search input::placeholder{color:#526863}select{height:42px;width:100%;padding:8px 11px;border:1px solid #7a928d;border-radius:7px;background:#fff;color:#263e3b}.more{height:42px;color:#006f68;white-space:nowrap;border-color:#80b4ac;background:#e0efec}.extra{padding:16px 24px;display:none;grid-template-columns:repeat(3,1fr);gap:16px;border-bottom:1px solid #dfe7e5;background:#f7faf9}.extra.show{display:grid}.table-wrap{flex:1;min-height:0;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{position:sticky;top:0;text-align:left;background:#e2e7ea;color:#34434b;font-weight:600;z-index:1}th,td{padding:14px 16px;border-bottom:1px solid #dfe7e5;line-height:1.4}th:first-child,td:first-child{padding-left:24px}tbody tr{cursor:pointer}tbody tr:nth-child(even){background:#fafcfb}tbody tr:hover,tbody tr.selected{background:#edf5f3}tbody tr.selected td:first-child{box-shadow:inset 3px 0 #006f68}td:first-child button{border:0;padding:0;background:transparent;color:#006f68;font-weight:650;text-decoration:underline;text-underline-offset:3px}td small{display:block;color:#526863;font-size:12px;margin-top:3px}.state{display:inline-block;padding:3px 8px;border-radius:5px;background:#eef1f3;color:#425563}.active{background:#ddf3e1;color:#246a36}.unknown{color:#526863}.footer{flex:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid #dfe7e5;background:#fff;font-size:13px}.keys{font-size:12px;color:#526863;display:flex;align-items:center;gap:8px}kbd{padding:2px 5px;border:1px solid #dfe7e5;border-radius:4px;font:inherit;background:#f7f8fa}.paging{display:flex;gap:12px;align-items:center}.paging button{padding:5px 10px}.empty{padding:70px 24px;text-align:center}.empty h3{font-size:18px}.empty p{color:#526863}.empty button{color:#006f68}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#203c39;color:white;padding:14px 20px;border-radius:8px;display:none;z-index:5}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.more{grid-column:1/-1}.veil{padding:12px}.modal{height:calc(100dvh - 90px)}.keys{display:none}.demo{padding:8px 12px}.demo>span{display:none}.header,.filters{padding-inline:16px}.extra{grid-template-columns:1fr}.footer{padding:14px 16px}table{min-width:1080px}}
</style><div class="demo"><strong>Proposta visual · dados fictícios</strong><span>Busca de animais — lista ao abrir</span><div><button onclick="reset()">Lista</button><button onclick="document.querySelector('#q').value='inexistente';render()">Sem resultados</button><button onclick="renderError()">Erro</button></div></div><main class="bg"><h1>Rebanho</h1><nav>Visão geral　　Animais　　Lotes</nav><section class="background-card"><h3>Demandam atenção</h3><p>Cuidados do rebanho</p></section></main><div class="veil"><section class="modal" role="dialog" aria-labelledby="title"><header class="header"><div><h2 id="title">Buscar animais</h2><p>Consolidado · Todos os sítios</p></div><button class="close" aria-label="Fechar" onclick="toast('Fecharia o modal e retornaria ao ponto de origem.')">×</button></header><div class="filters"><label>Animal<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="q" placeholder="Buscar por brinco ou nome" autocomplete="off" oninput="page=1;render()"></div></label><label>Situação<select id="status" onchange="page=1;render()"><option>Todos</option><option>Ativos</option><option>Baixados</option></select></label><label>Sexo<select id="sex" onchange="page=1;render()"><option>Todos</option><option>Fêmeas</option><option>Machos</option></select></label><label>Lote<select id="lot" onchange="page=1;render()"><option>Todos</option><option>Lactantes</option><option>Recria</option><option>Sem lote</option></select></label><button class="more" aria-expanded="false" onclick="let e=document.querySelector('.extra');e.classList.toggle('show');this.setAttribute('aria-expanded',e.classList.contains('show'))">Mais filtros</button></div><div class="extra"><label>Sítio<select><option>Todos os sítios</option><option>Sítio principal</option><option>Sítio arrendado</option></select></label><label>Categoria<select><option>Todas</option><option>Vaca</option><option>Novilha</option><option>Reprodutor</option></select></label><label>Finalidade<select><option>Todas</option><option>Leite</option><option>Corte</option></select></label></div><div id="results" class="table-wrap"></div><footer class="footer"><span id="count"></span><div class="keys"><kbd>↑</kbd><kbd>↓</kbd> navegar <kbd>Enter</kbd> abrir ficha <kbd>Esc</kbd> fechar</div><div class="paging"><button aria-label="Página anterior" onclick="page=Math.max(1,page-1);render()">‹</button><span id="page"></span><button aria-label="Próxima página" onclick="page=Math.min(pages,page+1);render()">›</button></div></footer></section></div><div class="toast" role="status"></div><script>
let page=1,pages=1,selected=0,visible=[];let names=['Estrela','Aurora','Jasmim','Vitória','Esperança','Bela','Sol','Lua'];const animals=Array.from({length:132},(_,i)=>({id:i+1,brinco:'EX-'+String(i+1).padStart(3,'0'),name:i%11===5?'':names[i%8]+(i>=8?' '+Math.floor(i/8):''),status:i%17===0?'Baixado':'Ativo',sex:i%13===7?'M':'F',cat:i%13===7?'Reprodutor':i%6===0?'Novilha':'Vaca',repro:i%13===7?'Não se aplica':i%7===0?'Não informada':i%3===0?'Gestante':'Vazia',prod:i%13===7?'Não se aplica':i%7===0?'Não informada':i%6===0?'Sem lactação':'Lactante',lot:i%9===0?'Sem lote':i%6===0?'Recria':'Lactantes',farm:i%4===0?'Sítio arrendado':'Sítio principal'}));
function render(){let q=document.querySelector('#q').value.toLowerCase(),status=document.querySelector('#status').value,sex=document.querySelector('#sex').value,lot=document.querySelector('#lot').value;let found=animals.filter(a=>(a.brinco+' '+a.name).toLowerCase().includes(q)&&(status==='Todos'||a.status===(status==='Ativos'?'Ativo':'Baixado'))&&(sex==='Todos'||a.sex===(sex==='Fêmeas'?'F':'M'))&&(lot==='Todos'||a.lot===lot));pages=Math.max(1,Math.ceil(found.length/20));page=Math.min(page,pages);visible=found.slice((page-1)*20,page*20);selected=0;document.querySelector('#count').textContent=found.length?`${(page-1)*20+1}–${Math.min(page*20,found.length)} de ${found.length} animais`:'0 animais';document.querySelector('#page').textContent=`${page} de ${pages}`;document.querySelector('#results').innerHTML=visible.length?'<table><thead><tr>'+['Brinco / nome','Situação','Categoria','Reprodução','Produção','Lote','Sítio'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+visible.map((a,i)=>`<tr class="${i===selected?'selected':''}" onclick="toast('Abriria a ficha de ${a.brinco} · registro fictício do mockup.')"><td><button>${a.brinco}</button><small>${a.name||'Nome não informado'}</small></td><td><span class="state ${a.status==='Ativo'?'active':''}">${a.status}</span></td><td>${a.cat}</td><td>${a.repro}</td><td>${a.prod}</td><td>${a.lot}</td><td>${a.farm}</td></tr>`).join('')+'</tbody></table>':'<div class="empty"><h3>Nenhum animal encontrado</h3><p>Altere o termo ou os filtros para tentar novamente.</p><button onclick="reset()">Limpar busca e filtros</button></div>';document.querySelector('#results').scrollTop=0}
function reset(){document.querySelector('#q').value='';['status','sex','lot'].forEach(id=>document.getElementById(id).selectedIndex=0);page=1;render()}
function renderError(){document.querySelector('#results').innerHTML='<div class="empty"><h3>Não foi possível carregar os animais</h3><p>Confira sua conexão e tente novamente.</p><button onclick="render()">Tentar novamente</button></div>';document.querySelector('#count').textContent='Consulta indisponível'}
function toast(text){let e=document.querySelector('.toast');e.textContent=text;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=Math.max(0,Math.min(visible.length-1,selected+(e.key==='ArrowDown'?1:-1)));document.querySelectorAll('tbody tr').forEach((tr,i)=>tr.classList.toggle('selected',i===selected));document.querySelectorAll('tbody tr')[selected]?.scrollIntoView({block:'nearest'})}if(e.key==='Enter'&&visible[selected])toast('Abriria a ficha de '+visible[selected].brinco+' · registro fictício do mockup.');if(e.key==='Escape')toast('Fecharia o modal e retornaria ao ponto de origem.')});render();document.querySelector('#q').focus();
</script></html>
