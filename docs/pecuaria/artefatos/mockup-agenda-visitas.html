<script>
'use strict';
const entrada=new URLSearchParams(location.search);const dataEntrada=entrada.get('data');const BASE=dataEntrada&&/^\d{4}-\d{2}-\d{2}$/.test(dataEntrada)&&Number.isFinite(Date.parse(dataEntrada+'T12:00:00Z'))?dataEntrada:'2026-10-14', STORAGE='fazendinha.mockup.agenda-separada.v1:'+BASE;
const datePlus=(data,n)=>new Date(Date.parse(data+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
const days=(a,b)=>Math.floor((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);
const fmt=d=>d?d.split('-').reverse().join('/'):'Não definida';

const groups=[
{id:'dg',secao:'Reprodução',nome:'Diagnóstico de gestação',protocolo:'IATF · ciclo de outubro',turma:'Matrizes A',etapa:'Diagnóstico após inseminação',when:BASE,precision:'DIA',tipo:'dg',ids:range(1,120),criterio:'Participantes com diagnóstico previsto para a data da visita.',version:'Versão 2'},

const CORE_GROUP_COUNT=groups.length;
function createExtra(type,lot){const gid='extra-'+type+'-'+(lot==='Maternidade'?'mat':'b');let g=groups.find(g=>g.id===gid);if(!g){g={id:gid,secao:'Seleções habituais',nome:type==='dg'?'Avaliação extra':'Exame sanitário extra',protocolo:null,turma:lot,etapa:'Atendimento adicional',when:BASE,precision:'DIA',tipo:type,ids:animals.filter(a=>a.lote===lot).slice(0,12).map(a=>a.id),criterio:'Inclusão adicional pelo lote '+lot+'.',version:'Extra desta visita'};groups.push(g);}return g;}
function initial(){return {version:1,extras:[],date:BASE,window:'DIA',selected:[],excluded:{},reviewed:[],results:{},confirmed:[],notes:{},prepared:false,search:'',page:1,sort:'brinco',reverse:false,onlyAlerts:false,reviewScope:'dg',activeGroup:'dg',expanded:null,confirming:false,feedback:''};}
let state=initial();try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&saved.version===1){state={...state,...saved};for(const extra of state.extras||[]){if(['dg','exame'].includes(extra.type)&&['Matrizes B','Maternidade'].includes(extra.lot))createExtra(extra.type,extra.lot);}state.selected=state.selected.filter(id=>groups.some(g=>g.id===id));state.confirming=false;state.expanded=null;}}catch{}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{}}
const group=id=>groups.find(g=>g.id===id)||groups[0];
const animal=id=>animals.find(a=>a.id===id);
const included=g=>g.ids.filter(id=>!(state.excluded[g.id]||[]).includes(id));
const picked=()=>groups.filter(g=>state.selected.includes(g.id));
const unique=()=>new Set(picked().flatMap(g=>included(g))).size;
const total=()=>picked().reduce((n,g)=>n+included(g).length,0);
const resultKey=(g,id)=>g.id+':'+id;
const del=a=>a.lactacao&&days(state.date,a.lactacao)>=0?days(state.date,a.lactacao):null;
const productive=a=>a.seca?'Seca':del(a)!==null?String(del(a)):'—';
const visitWindow=g=>!g.when?'SEM_PREVISAO':g.when===state.date?'DIA':g.when<state.date?'ANTERIOR':'FUTURA';
let toastTimer;
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;el.setAttribute('role','status');document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),4500);}
function navigate(page,scope){state.onlyAlerts=false;if(scope)state.reviewScope=scope;state.search='';state.page=1;state.expanded=null;state.confirming=false;save();const hash='#'+page;if(location.hash===hash)render(true);else location.hash=hash;}
function screen(){const s=location.hash.slice(1).split('?')[0];return ['planejamento','revisao','atendimento'].includes(s)?s:'planejamento';}
function header(page,title,subtitle,actions=''){return `<div class="breadcrumbs"><a href="mockup-selecao-livre.html#entrada">Nova visita</a><span>/</span><span>${esc(entrada.get('nome')||'Visita veterinária')} · ${fmt(state.date)}</span></div><div class="heading"><div><div class="eyebrow">Agenda do dia · Sítio Principal</div><h1 id="page-title" tabindex="-1">${title}</h1><p class="subtitle">${subtitle}</p></div><div class="heading-actions"><a class="button" href="mockup-selecao-livre.html#entrada">Escolher outro caminho</a>${actions}</div></div><nav class="steps" aria-label="Etapas da visita">${[['planejamento','Agenda','Demandas previstas'],['revisao','Revisão dos animais','Conferir a seleção'],['atendimento','Atendimento','Registrar os procedimentos']].map(([id,name,sub],i)=>`<button type="button" class="step ${page===id?'active':''} ${i===0&&page!=='planejamento'||i===1&&page==='atendimento'?'done':''}" data-nav="${id}" ${id==='revisao'&&!state.selected.length?'disabled':''} ${id==='atendimento'&&!state.prepared?'disabled':''} ${page===id?'aria-current="step"':''}><span class="number">${i+1}</span><span><strong>${name}</strong><small>${sub}</small></span></button>`).join('')}</nav>`;}
function discussion(){return `<details class="flow-note"><summary>O que observar neste mockup</summary><ul><li>Esta agenda contém apenas tarefas previstas e retornos registrados. Filtros salvos e seleção livre pertencem ao outro caminho.</li><li>Agenda, revisão e atendimento ocupam páginas inteiras. A navegação de volta conserva suas escolhas.</li><li>Protocolo e critérios ficam no cabeçalho. Na tabela, cada informação tem sua coluna.</li><li>“Tentativas” é a quantidade no ciclo; “Dias desde IA/TE” é o intervalo desde o último procedimento.</li><li>DEL usa a data da visita. “Seca” exige secagem conhecida; “—” indica ausência do dado.</li><li>Atendimento mostra um resultado principal por linha. Detalhes só aparecem quando necessários.</li></ul><div class="feedback"><label for="feedback">Suas observações para discutirmos</label><textarea id="feedback" placeholder="O que facilita a rotina? O que ainda fica confuso?">${esc(state.feedback)}</textarea><div class="actions"><button class="button small" data-action="export">Exportar observações</button><span class="quiet">Guardadas somente neste navegador. HTML demonstrativo, sem acesso ao banco.</span></div></div></details>`;}
function footer(summary,sub,buttons){document.getElementById('footer').innerHTML=`<div class="footer-inner"><div><strong>${summary}</strong><small>${sub}</small></div><div class="actions">${buttons}</div></div>`;}
function planning(){const available=groups.filter(g=>visitWindow(g)===state.window);let html=header('planejamento','Agenda do dia','Escolha as demandas previstas em Reprodução e Sanidade. Confira os animais antes de preparar a visita.',state.prepared?'<button class="button" data-nav="atendimento">Retomar atendimento</button>':'');html+=`<div class="settings"><label for="visit-date">Data da visita <input id="visit-date" type="date" value="${state.date}"></label><span class="badge gray">Sítio Principal</span><span class="hint">As previsões e o DEL são apresentados em relação à data da visita.</span></div><div class="windows" role="group" aria-label="Janela das tarefas">${[['DIA','Previstos para o dia'],['ANTERIOR','Pendências anteriores'],['SEM_PREVISAO','Sem previsão'],['FUTURA','Datas futuras']].map(([id,label])=>`<button class="window ${state.window===id?'selected':''}" data-window="${id}" aria-pressed="${state.window===id}">${label}<span class="count">${groups.filter(g=>visitWindow(g)===id).length}</span></button>`).join('')}</div><section class="panel" aria-label="Grupos de atendimento"><div class="panel-header"><div><h2>Grupos disponíveis</h2><p>Marque um grupo inteiro ou revise a lista para retirar animais.</p></div><span class="badge gray">${state.selected.length} grupos selecionados</span></div>`;
for(const sec of ['Reprodução','Sanidade']){html+=`<div class="section-label">${sec}</div>`;const list=available.filter(g=>g.secao===sec);html+=list.length?list.map(g=>groupRow(g)).join(''):`<div class="empty">Nenhum grupo de ${sec.toLowerCase()} nesta janela.</div>`;}
html+=`<div class="summary"><div><b>${unique()}</b><span>animais únicos</span></div><div><b>${total()}</b><span>procedimentos selecionados</span></div><p class="hint">Um animal pode precisar de diagnóstico e aplicação na mesma visita. Ele conta uma vez no total de animais.</p></div></section>`+discussion();
footer(`${unique()} animais únicos · ${total()} procedimentos`,state.selected.length?`${state.selected.length} grupos selecionados · sua seleção fica preservada ao navegar.`:'Selecione os grupos que deseja levar para a visita.',`<button class="button primary" data-action="review-all" ${!total()?'disabled':''}>Revisar seleção</button>`);return html;}
function groupRow(g){const checked=state.selected.includes(g.id),count=included(g).length;const alerts=g.ids.filter(id=>animal(id).outraVisita).length;return `<div class="group ${checked?'chosen':''}"><input type="checkbox" data-pick="${g.id}" ${checked?'checked':''} aria-label="Selecionar ${esc(g.nome+' · '+g.turma)}"><div><div class="group-title">${esc(g.nome)}</div><div class="group-sub">${esc(g.protocolo||g.criterio)}</div><div class="group-labels">${state.reviewed.includes(g.id)?'<span class="badge green">Revisado</span>':''}${alerts?`<span class="badge amber">${alerts} em outra visita aberta</span>`:''}${checked&&count<g.ids.length?`<span class="badge gray">${g.ids.length-count} excluídos</span>`:''}</div></div><div><div class="group-title">${esc(g.turma)}</div><div class="group-sub">${g.when?fmt(g.when):'Horário ainda não definido'} · ${esc(g.version)}</div></div><div class="group-stat">${checked?count:g.ids.length}<small>animais${checked&&count<g.ids.length?' incluídos':''}</small></div><button class="button small" data-review="${g.id}">Revisar animais</button></div>`;}
function extraForm(){return `<div class="toolbar"><label class="field" for="extra-lot">Lote <select id="extra-lot"><option value="Matrizes B">Matrizes B</option><option value="Maternidade">Maternidade</option></select></label><label class="field" for="extra-type">Atendimento <select id="extra-type"><option value="dg">Avaliação reprodutiva</option><option value="exame">Exame sanitário</option></select></label><button class="button primary small" data-action="create-extra">Revisar lista adicional</button></div>`;}
function review(){const g=group(state.reviewScope);const list=visibleAnimals(g);const excluded=state.excluded[g.id]||[];const alertCount=g.ids.filter(id=>animal(id).outraVisita).length;let html=header('revisao','Revisar animais','Confira os dados por coluna e desmarque quem ficará fora deste grupo. Nenhum exame é registrado nesta etapa.','<button class="button" data-nav="planejamento">Voltar à agenda</button>');html+=`<section class="panel"><div class="panel-header"><div><h2>${esc(g.nome)}</h2><p>${esc(g.turma)} · ${g.ids.length} animais na lista · ${included(g).length} incluídos</p></div><span class="badge green">Dados em ${fmt(state.date)}</span></div>${picked().length>1?`<div class="review-scope"><span class="quiet">Revisar outro grupo:</span><label class="sr-only" for="review-group">Grupo em revisão</label><select id="review-group" class="result-select">${[...new Set([g.id,...state.selected])].map(id=>`<option value="${id}" ${id===g.id?'selected':''}>${esc(group(id).nome+' · '+group(id).turma)}</option>`).join('')}</select>${picked().filter(x=>x.id!==g.id).map(x=>`<span class="chip">${esc(x.nome)} · ${included(x).length}</span>`).join('')}</div>`:''}<div class="context-band"><div><span>Protocolo / seleção</span>${esc(g.protocolo||g.nome)}</div><div><span>Etapa</span>${esc(g.etapa)}</div><div><span>Previsto para</span>${fmt(g.when)}</div><div><span>Critério de inclusão</span>${esc(g.criterio)}</div></div>${alertCount?`<div class="notice"><span><strong>${alertCount} animais já estão em outra visita aberta.</strong> Confira as linhas sinalizadas para evitar preparar o mesmo procedimento duas vezes.</span><button class="link-button" data-action="alerts">${state.onlyAlerts?'Mostrar todos':'Ver esses animais'}</button></div>`:''}<div class="toolbar"><label class="field" for="search">Buscar <input id="search" class="search" type="search" value="${esc(state.search)}" placeholder="Brinco, nome ou lote"></label><button class="link-button" data-action="select-filtered">Incluir todos os filtrados</button><button class="link-button" data-action="exclude-filtered">Excluir todos os filtrados</button><div class="right"><span>${excluded.length} excluídos deste grupo</span><span class="mobile-scroll">Deslize a tabela para ver as colunas</span></div></div>${animalTable(g,list,false)}${pagination(list.length)}<div class="notice soft"><span>RP = retenção de placenta no parto de referência. “—” = não informado. “Seca” não equivale a DEL zero.</span></div></section>`+discussion();
footer(`${included(g).length} de ${g.ids.length} animais incluídos neste grupo`,`${unique()} animais únicos · ${total()} procedimentos na seleção da visita.`, `<button class="button" data-action="save-group">Salvar grupo e voltar</button><button class="button primary" data-action="prepare" ${!included(g).length?'disabled':''}>Preparar visita e ir ao atendimento</button>`);return html;}
function visibleAnimals(g){return g.ids.map(animal).filter(a=>(!state.onlyAlerts||a.outraVisita)&&(!state.search||[a.brinco,a.nome,a.lote,a.categoria].some(v=>v.toLocaleLowerCase('pt-BR').includes(state.search.toLocaleLowerCase('pt-BR'))))).sort((a,b)=>{let x,y;if(state.sort==='del'){x=del(a)??-1;y=del(b)??-1;}else{x=a.brinco;y=b.brinco;}return (typeof x==='number'?x-y:x.localeCompare(y,'pt-BR',{numeric:true}))*(state.reverse?-1:1);});}
function animalTable(g,list,attendance){const pageCount=Math.max(1,Math.ceil(list.length/15));state.page=Math.min(state.page,pageCount);const page=list.slice((state.page-1)*15,state.page*15);let html=`<div class="table-wrap ${attendance?'attendance':''}" tabindex="0" role="region" aria-label="${attendance?'Atendimento':'Revisão'} dos animais; tabela com rolagem"><table><caption class="sr-only">${esc(g.nome)}: contexto dos animais na data da visita</caption><thead><tr>${!attendance?'<th scope="col" class="checkcol"><span class="sr-only">Incluir animal</span></th>':''}<th scope="col" class="animalcol"><button class="sort" data-sort="brinco">Animal${state.sort==='brinco'?(state.reverse?' ↓':' ↑'):''}</button></th><th scope="col">Lote</th><th scope="col">Categoria</th><th scope="col">Situação</th><th scope="col" class="numeric"><button class="sort" data-sort="del">DEL${state.sort==='del'?(state.reverse?' ↓':' ↑'):''}</button></th><th scope="col" class="numeric">Tentativas</th><th scope="col" class="numeric">Dias desde IA/TE</th><th scope="col" class="numeric">Partos</th><th scope="col">RP</th>${attendance?'<th scope="col">Resultado do atendimento</th><th scope="col">Detalhes</th>':'<th scope="col">Atenção</th>'}</tr></thead><tbody>`;
html+=page.length?page.map(a=>{const isIncluded=!(state.excluded[g.id]||[]).includes(a.id);const key=resultKey(g,a.id);const confirmed=state.confirmed.includes(key);const result=state.results[key]||'';let row=`<tr class="${!isIncluded?'excluded':''}">${!attendance?`<td class="checkcol"><input type="checkbox" data-animal="${a.id}" ${isIncluded?'checked':''} aria-label="Incluir animal ${a.brinco} ${esc(a.nome)}"></td>`:''}<td class="animalcol animal-name"><span class="brinco">${a.brinco}</span> ${esc(a.nome)}</td><td>${esc(a.lote)}</td><td>${esc(a.categoria)}</td><td><span class="badge ${a.situacao==='Gestante'?'green':a.situacao==='Vazia'?'gray':'blue'}">${a.situacao}</span></td><td class="numeric">${productive(a)}</td><td class="numeric">${a.tentativas}</td><td class="numeric">${a.ia&&days(state.date,a.ia)>=0?days(state.date,a.ia):'—'}</td><td class="numeric">${a.partos}</td><td>${a.rp===null?'—':a.rp?'<span class="badge amber">Sim</span>':'Não'}</td>`;
if(attendance){row+=`<td>${confirmed?`<span class="badge green">${esc(resultLabel(g,result))}</span><span class="quiet" style="display:block;margin-top:4px">Confirmado na simulação</span>`:`<select class="result-select ${result?'filled':''}" data-result="${a.id}" aria-label="Resultado do animal ${a.brinco}"><option value="">Selecionar resultado</option>${resultOptions(g).map(([val,label])=>`<option value="${val}" ${val===result?'selected':''}>${label}</option>`).join('')}</select>`}</td><td><button class="link-button" data-details="${a.id}" aria-expanded="${state.expanded===a.id}" aria-label="Detalhes do animal ${a.brinco}">${state.expanded===a.id?'Fechar':'Detalhes'}</button></td>`;}else row+=`<td>${a.outraVisita?`<button class="info-link" data-warning="${a.id}">Outra visita aberta</button>`:'<span class="muted">—</span>'}</td>`;
row+='</tr>';if(attendance&&state.expanded===a.id)row+=rowDetails(g,a,confirmed);return row;}).join(''):`<tr><td colspan="12" class="empty">Nenhum animal corresponde à busca. <button class="link-button" data-action="clear-search">Limpar filtros</button></td></tr>`;
return html+'</tbody></table></div>';}
function pagination(n){return `<div class="pagination"><span>${n?Math.min((state.page-1)*15+1,n):0}–${Math.min(state.page*15,n)} de ${n} animais · 15 por página</span><div class="pages"><button class="button small" data-page="-1" ${state.page===1?'disabled':''}>Anterior</button><span>Página ${state.page} de ${Math.max(1,Math.ceil(n/15))}</span><button class="button small" data-page="1" ${state.page*15>=n?'disabled':''}>Próxima</button></div></div>`;}
function resultOptions(g){if(g.tipo==='dg')return [['positivo','Prenhez confirmada'],['negativo','Vazia'],['reconfirmado','Continua gestante'],['sexagem','Sexagem'],['inconclusivo','Inconclusivo'],['ausente','Não atendido']];if(g.tipo==='reconf')return [['reconfirmado','Continua gestante'],['inconclusivo','Inconclusivo'],['ausente','Não atendido']];if(g.tipo==='exame')return [['negativo','Negativo'],['positivo','Positivo'],['inconclusivo','Inconclusivo'],['ausente','Não atendido']];return [['realizado',g.tipo==='ia'?'Inseminação realizada':g.tipo==='retirada'?'Retirada realizada':g.tipo==='inicio'?'Protocolo iniciado':'Aplicação realizada'],['adiado','Adiado'],['ausente','Não atendido']];}
function resultLabel(g,v){return resultOptions(g).find(x=>x[0]===v)?.[1]||'Pendente';}
function rowDetails(g,a,locked){const key=resultKey(g,a.id),r=state.results[key],note=state.notes[key]||{};return `<tr class="row-details"><td colspan="12"><div class="detail-fields">${r==='sexagem'?`<label>Sexo fetal<select data-note="sexo" data-id="${a.id}" ${locked?'disabled':''}><option value="">Selecione</option><option value="F" ${note.sexo==='F'?'selected':''}>Fêmea</option><option value="M" ${note.sexo==='M'?'selected':''}>Macho</option></select></label>`:''}${r==='negativo'&&g.tipo==='dg'?`<label>Conduta (opcional)<select data-note="conduta" data-id="${a.id}" ${locked?'disabled':''}><option value="">Sem indicação</option><option value="aguardar" ${note.conduta==='aguardar'?'selected':''}>Aguardar / reavaliar</option><option value="iatf" ${note.conduta==='iatf'?'selected':''}>Indicar IATF</option></select></label>`:''}<label>Retorno (opcional)<input type="date" data-note="retorno" data-id="${a.id}" value="${esc(note.retorno||'')}" ${locked?'disabled':''}></label><label class="observation">${r==='ausente'||r==='adiado'?'Motivo obrigatório':'Observação (opcional)'}<input data-note="texto" data-id="${a.id}" value="${esc(note.texto||'')}" placeholder="${r==='ausente'?'Ex.: animal não localizado no manejo':'Informação adicional deste animal'}" ${locked?'disabled':''}></label></div>${g.tipo==='ia'?'<p class="quiet">Material planejado: Sêmen Atlas · 1 dose. No app, material, lote e saldo serão conferidos antes da confirmação.</p>':''}${a.outraVisita?`<p class="quiet">Também incluído em: ${esc(a.outraVisita)}. A indicação não comprova execução.</p>`:''}</td></tr>`;}
function attendance(){if(!state.prepared||!picked().length){navigate('planejamento');return '';}if(!state.selected.includes(state.activeGroup))state.activeGroup=state.selected[0];const g=group(state.activeGroup);const selectedIds=included(g);const list=visibleAnimals(g).filter(a=>selectedIds.includes(a.id));const done=picked().reduce((n,x)=>n+included(x).filter(id=>state.confirmed.includes(resultKey(x,id))).length,0);let html=header('atendimento','Atendimento da visita','Registre o resultado de cada animal. As referências da lista continuam visíveis durante o atendimento.','<button class="button" data-nav="planejamento">Ajustar agenda</button><button class="button" data-action="print">Imprimir ficha de campo</button>');if(state.justPrepared)html+='<div class="success-banner"><strong>Lista preparada.</strong> Agora você pode imprimir, atender no campo ou registrar os resultados. Preparar a visita não executa os procedimentos.</div>';html+=`<div class="activity-tabs" role="group" aria-label="Atendimentos da visita">${picked().map(x=>`<button class="activity-tab ${x.id===g.id?'active':''}" data-activity="${x.id}" aria-pressed="${x.id===g.id}"><span>${esc(x.nome)}</span><small>${esc(x.turma)} · ${included(x).length} animais · ${included(x).filter(id=>state.confirmed.includes(resultKey(x,id))).length} confirmados</small></button>`).join('')}</div>`;
if(state.confirming)html+=confirmation(g);
html+=`<section class="panel"><div class="panel-header"><div><h2>${esc(g.nome)}</h2><p>${esc(g.turma)} · ${selectedIds.length} animais na lista preparada</p></div><span class="badge gray">${selectedIds.filter(id=>state.confirmed.includes(resultKey(g,id))).length} / ${selectedIds.length} confirmados</span></div><div class="context-band"><div><span>Protocolo / seleção</span>${esc(g.protocolo||g.nome)}</div><div><span>Data do atendimento</span>${fmt(state.date)}</div><div><span>Referência compartilhada</span>${g.tipo==='ia'?'Sêmen Atlas · 1 dose por animal':g.tipo==='aplicacao'?'Insumo demonstrativo · plano da etapa':esc(g.etapa)}</div></div><div class="notice soft"><span>${g.tipo==='dg'||g.tipo==='reconf'?'Conclusão, sexo fetal e conduta são informações distintas. Os complementos aparecem em “Detalhes”.':'O resultado principal fica na linha. Os dados complementares do procedimento ficam em “Detalhes”.'} Tudo nesta página é uma simulação.</span></div><div class="toolbar"><label class="field" for="search">Buscar <input id="search" class="search" type="search" value="${esc(state.search)}" placeholder="Brinco, nome ou lote"></label><div class="right"><span>Resultados em rascunho preservados neste navegador</span><span class="mobile-scroll">Deslize a tabela para ver o resultado</span></div></div>${animalTable(g,list,true)}${pagination(list.length)}</section>`+discussion();
const drafts=included(g).filter(id=>state.results[resultKey(g,id)]&&!state.confirmed.includes(resultKey(g,id))).length;footer(`${done} procedimentos confirmados na simulação`,`${drafts} resultado(s) em rascunho neste grupo · nenhum dado enviado ao app.`,`<button class="button" data-action="review-active">Rever animais</button><button class="button primary" data-action="check-results" ${!drafts?'disabled':''}>Conferir ${drafts||''} resultado${drafts===1?'':'s'}</button>`);return html;}
function confirmation(g){const ids=included(g).filter(id=>state.results[resultKey(g,id)]&&!state.confirmed.includes(resultKey(g,id)));const counts={};ids.forEach(id=>{const label=resultLabel(g,state.results[resultKey(g,id)]);counts[label]=(counts[label]||0)+1;});return `<section class="confirm-box" id="confirmation" tabindex="-1"><h2>Conferir antes de confirmar</h2><p>Você está prestes a confirmar <strong>${ids.length} atendimentos</strong> deste grupo. Os animais sem resultado continuarão pendentes.</p><ul>${Object.entries(counts).map(([label,n])=>`<li>${n} · ${esc(label)}</li>`).join('')}</ul><p class="quiet">No app, esta confirmação deverá conferir vínculos e restrições e registrar cada fato individual. Prenhez confirmada abre ou vincula gestação; reconfirmação e sexagem atualizam a gestação existente. Indicar IATF não inicia o protocolo. Consumo só acompanha procedimentos efetivamente confirmados.</p><div class="actions"><button class="button" data-action="cancel-confirm">Voltar aos resultados</button><button class="button primary" data-action="confirm">Confirmar na simulação</button></div></section>`;}
function render(focus=false){const active=document.activeElement,id=active?.id,caret=active?.selectionStart;const page=screen();document.getElementById('app').innerHTML=page==='planejamento'?planning():page==='revisao'?review():attendance();save();if(focus){window.scrollTo({top:0,behavior:'instant'});document.getElementById('page-title')?.focus({preventScroll:true});}else if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(typeof caret==='number'&&typeof el.setSelectionRange==='function'&&['search','text'].includes(el.type))el.setSelectionRange(caret,caret);}}}
function commitGroup(){const g=group(state.reviewScope);if(!included(g).length){toast('Inclua pelo menos um animal para usar o grupo.');return false;}if(!state.selected.includes(g.id))state.selected.push(g.id);if(!state.reviewed.includes(g.id))state.reviewed.push(g.id);save();return true;}
function prepare(){if(!commitGroup())return;state.prepared=true;state.justPrepared=true;state.activeGroup=state.reviewScope;navigate('atendimento');}
function printSheet(){const selected=picked();document.getElementById('print-sheet').innerHTML=`<h1>Visita veterinária · ${fmt(state.date)}</h1><p>Sítio Principal · ${unique()} animais únicos · ${total()} procedimentos · Ficha demonstrativa</p>${selected.map(g=>`<section class="print-group"><h2>${esc(g.nome)} · ${esc(g.turma)}</h2><p>${esc(g.protocolo||g.nome)} · ${esc(g.version)} · ${esc(g.criterio)} · Data de referência: ${fmt(state.date)}</p><table><thead><tr>${['Animal','Lote','Categoria','Situação','DEL','Tentativas','Dias IA/TE','Partos','RP','Resultado / anotação'].map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${included(g).map(animal).sort((a,b)=>a.n-b.n).map(a=>`<tr><td>${a.brinco} ${esc(a.nome)}</td><td>${esc(a.lote)}</td><td>${esc(a.categoria)}</td><td>${esc(a.situacao)}</td><td>${productive(a)}</td><td>${a.tentativas}</td><td>${a.ia?days(state.date,a.ia):'—'}</td><td>${a.partos}</td><td>${a.rp===null?'—':a.rp?'Sim':'Não'}</td><td style="min-width:140px;height:29px"></td></tr>`).join('')}</tbody></table></section>`).join('')}<p>RP: retenção de placenta no parto de referência · —: não informado · Dados fictícios.</p>`;window.print();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='reset-demo'){groups.splice(CORE_GROUP_COUNT);state=initial();save();navigate('planejamento');toast('Demonstração reiniciada.');return;}if(b.dataset.nav){if(b.dataset.nav==='revisao')state.reviewScope=state.selected[0]||'dg';navigate(b.dataset.nav);return;}if(b.dataset.window){state.window=b.dataset.window;render();return;}if(b.dataset.review){state.onlyAlerts=false;navigate('revisao',b.dataset.review);return;}if(b.dataset.page){state.page+=Number(b.dataset.page);render();return;}if(b.dataset.sort){state.reverse=state.sort===b.dataset.sort?!state.reverse:false;state.sort=b.dataset.sort;render();return;}if(b.dataset.warning){const a=animal(b.dataset.warning);toast(`${a.brinco} ${a.nome} também está em “${a.outraVisita}”. Verifique a necessidade de manter as duas listas.`);return;}if(b.dataset.activity){state.activeGroup=b.dataset.activity;state.page=1;state.search='';state.expanded=null;state.onlyAlerts=false;state.justPrepared=false;state.confirming=false;render();return;}if(b.dataset.details){state.expanded=state.expanded===b.dataset.details?null:b.dataset.details;render();return;}const action=b.dataset.action;if(action==='review-all'){state.onlyAlerts=false;navigate('revisao',state.selected[0]);}if(action==='save-group'&&commitGroup()){navigate('planejamento');toast('Grupo revisado. A seleção foi preservada.');}if(action==='prepare')prepare();if(action==='alerts'){state.onlyAlerts=!state.onlyAlerts;state.page=1;render();}if(action==='clear-search'){state.search='';state.onlyAlerts=false;render();}if(action==='select-filtered'||action==='exclude-filtered'){const g=group(state.reviewScope),ids=visibleAnimals(g).map(a=>a.id),old=state.excluded[g.id]||[];state.excluded[g.id]=action==='select-filtered'?old.filter(id=>!ids.includes(id)):[...new Set([...old,...ids])];render();}if(action==='review-active'){state.reviewScope=state.activeGroup;state.onlyAlerts=false;navigate('revisao');}if(action==='check-results'){state.confirming=true;render();document.getElementById('confirmation')?.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('confirmation')?.focus({preventScroll:true});}if(action==='cancel-confirm'){state.confirming=false;render();}if(action==='confirm')confirmResults();if(action==='print')printSheet();if(action==='extra'){state.extraOpen=!state.extraOpen;render();}if(action==='create-extra'){const lot=document.getElementById('extra-lot').value,type=document.getElementById('extra-type').value,g=createExtra(type,lot);if(!state.extras.some(x=>x.type===type&&x.lot===lot))state.extras.push({type,lot});state.onlyAlerts=false;navigate('revisao',g.id);}if(action==='export'){const payload={proposta:'Fluxo de visitas — mockup HTML',exportadoEm:new Date().toISOString(),dataVisita:state.date,observacoes:state.feedback,gruposSelecionados:picked().map(g=>({nome:g.nome,animais:included(g).length}))};const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));link.download='feedback-fluxo-visitas.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Observações exportadas.');}});
function confirmResults(){state.search='';state.onlyAlerts=false;const g=group(state.activeGroup),ids=included(g).filter(id=>state.results[resultKey(g,id)]&&!state.confirmed.includes(resultKey(g,id)));for(const id of ids){const k=resultKey(g,id),r=state.results[k],note=state.notes[k]||{};if((r==='ausente'||r==='adiado')&&(!note.texto||note.texto.trim().length<5)){state.expanded=id;state.page=Math.floor(visibleAnimals(g).filter(a=>included(g).includes(a.id)).findIndex(a=>a.id===id)/15)+1;state.confirming=false;render();toast('Informe um motivo com pelo menos 5 caracteres para '+animal(id).brinco+'.');return;}if(r==='sexagem'&&!note.sexo){state.expanded=id;state.page=Math.floor(visibleAnimals(g).filter(a=>included(g).includes(a.id)).findIndex(a=>a.id===id)/15)+1;state.confirming=false;render();toast('Informe o sexo fetal para o animal '+animal(id).brinco+'.');return;}}state.confirmed=[...new Set([...state.confirmed,...ids.map(id=>resultKey(g,id))])];state.confirming=false;state.justPrepared=false;render();toast(`${ids.length} atendimento(s) confirmado(s) apenas na simulação. O banco do app permanece inalterado.`);}
document.addEventListener('change',e=>{const t=e.target;if(t.id==='visit-date'){if(!/^\d{4}-\d{2}-\d{2}$/.test(t.value)){render();return;}state.date=t.value;state.reviewed=[];render();}if(t.dataset.pick){state.selected=t.checked?[...new Set([...state.selected,t.dataset.pick])]:state.selected.filter(id=>id!==t.dataset.pick);render();}if(t.dataset.animal){const g=group(state.reviewScope),old=state.excluded[g.id]||[];state.excluded[g.id]=t.checked?old.filter(id=>id!==t.dataset.animal):[...new Set([...old,t.dataset.animal])];render();}if(t.id==='review-group'){state.reviewScope=t.value;state.search='';state.page=1;state.onlyAlerts=false;render();}if(t.dataset.result){const g=group(state.activeGroup),k=resultKey(g,t.dataset.result);state.results[k]=t.value;if(['sexagem','negativo','ausente','adiado'].includes(t.value))state.expanded=t.dataset.result;state.confirming=false;render();}if(t.dataset.note){const k=resultKey(group(state.activeGroup),t.dataset.id);state.notes[k]={...(state.notes[k]||{}),[t.dataset.note]:t.value};save();}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){state.search=t.value;state.page=1;render();}if(t.id==='feedback'){state.feedback=t.value;save();}if(t.dataset.note){const k=resultKey(group(state.activeGroup),t.dataset.id);state.notes[k]={...(state.notes[k]||{}),[t.dataset.note]:t.value};save();}});
window.addEventListener('hashchange',()=>render(true));render();
</script>
</body>
