<div class="prototype"><strong>Proposta para discussão</strong><span>Entrada por agenda ou seleção livre · dados fictícios · <a href="plano-separacao-fluxos-visitas.html">consultar o plano</a></span><button id="reset" type="button">Reiniciar demonstração</button></div>
<header class="topbar"><div class="brand">fazendinha</div><div class="domain">Pecuária / Visitas</div><div class="context">Sítio Principal</div></header>
<main id="app" class="container"></main><div id="footer" class="footer-bar"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const BASE='2026-10-14', KEY='fazendinha:mockup-selecao-livre:v1';
const lots=['Matrizes A','Matrizes B','Novilhas','Maternidade'];
const breeds=['Holandês','Girolando','Jersey'];
const labels={VAZIA:'Vazia',GESTANTE:'Gestante',AGUARDANDO_DIAGNOSTICO:'Aguardando diagnóstico',DESCONHECIDA:'Não informada',LACTANTE:'Lactante',SECA:'Seca',SEM_LACTACAO:'Sem lactação',PADRAO:'Sem papel especial',DOADORA:'Doadora',RECEPTORA:'Receptora',F:'Fêmea',M:'Macho'};
const offset=(d,n)=>new Date(Date.parse(d+'T12:00:00Z')+n*86400000).toISOString().slice(0,10);
const delta=(d,f)=>f==null?null:Math.floor((Date.parse(d+'T12:00:00Z')-Date.parse(f+'T12:00:00Z'))/86400000);
const fmt=d=>d.split('-').reverse().join('/');
const names=['Aurora','Brisa','Clara','Dália','Estrela','Flora','Gaia','Hera','Íris','Jade','Luna','Mimosa','Nina','Olívia','Pérola','Rosa','Safira','Tulipa'];
const animals=Array.from({length:96},(_,i)=>{
 const n=i+1,novilha=n%5===0,macho=n%23===0,cat=macho?'Macho':novilha?'Novilha':'Vaca';
 const pregnant=n%6===0?null:n%4===0?67:n%4===1?142:n%4===2?196:null;
 const parto=novilha||macho||n%17===0?null:offset(BASE,-(pregnant?pregnant+60+n%35:35+n%155));
 return{id:'a'+n,brinco:String(n).padStart(3,'0'),nome:macho?'Touro '+n:names[i%names.length]+(n>18?' '+(Math.floor(i/18)+1):''),sexo:macho?'M':'F',categoria:cat,lote:novilha?'Novilhas':n%7===0?'Maternidade':n%2?'Matrizes A':'Matrizes B',raca:breeds[i%3],nascimento:offset(BASE,-(novilha?540+n:1100+n*13)),peso:novilha?300+n:470+n,parto,tentativa:pregnant?offset(BASE,-pregnant):n%3?offset(BASE,-(20+n%25)):null,confirmacao:pregnant?offset(BASE,-Math.max(0,pregnant-30)):null,aptidao:novilha?offset(BASE,-(15+n%70)):null,gestacao:pregnant?offset(BASE,-pregnant):null,secagem:pregnant&&pregnant>185&&!novilha&&!macho?offset(BASE,-12):null,papel:n%13===0?'DOADORA':n%7===0?'RECEPTORA':'PADRAO',partos:parto?1+n%4:0,tentativas:1+n%3,rp:parto?n%11===0?true:n%3===0?null:false:null,descarte:n%19===0,protocolado:n%9===0,outraVisita:n%11===0,origem:n%4===0?'COMPRA':'NASCIMENTO'};
});
function context(a,date){const gestante=!!a.gestacao&&date>=a.confirmacao;return{...a,idadeMeses:Math.floor(delta(date,a.nascimento)/30.4375),diasParto:a.parto&&a.parto<=date?delta(date,a.parto):null,diasTentativa:a.tentativa&&a.tentativa<=date?delta(date,a.tentativa):null,diasAptidao:a.aptidao&&a.aptidao<=date?delta(date,a.aptidao):null,idadeGestacao:gestante?delta(date,a.gestacao):null,situacao:gestante?'GESTANTE':a.tentativa&&a.tentativa<=date?'AGUARDANDO_DIAGNOSTICO':a.parto||a.categoria==='Novilha'?'VAZIA':'DESCONHECIDA',producao:!a.parto||a.parto>date?'SEM_LACTACAO':a.secagem&&a.secagem<=date?'SECA':'LACTANTE',del:a.parto&&a.parto<=date&&(!a.secagem||date<a.secagem)?delta(date,a.parto):null};}
function defaults(){return{date:BASE,lotes:[...lots],categorias:['Vaca','Novilha'],sexos:['F'],papeis:['PADRAO','DOADORA','RECEPTORA'],producao:['LACTANTE','SECA','SEM_LACTACAO'],situacoes:['VAZIA','AGUARDANDO_DIAGNOSTICO','GESTANTE','DESCONHECIDA'],racas:[...breeds],descarte:'TODOS',rp:'TODOS',origem:'TODOS',excludeProtocol:true,vazias:true,vaziasMin:25,tentativa:true,tentativaMin:26,gestacao:true,g1min:63,g1max:70,g2min:135,g2max:150,g3min:185,g3max:210,novilhas:false,novilhasMin:30,semParto:false,delMin:'',delMax:'',idadeMin:'',idadeMax:'',pesoMin:'',pesoMax:'',tentativasMin:'',tentativasMax:'',busca:''};}
const state={entryMode:null,entryConfirmed:false,entry:{nome:'Visita veterinária',date:BASE,responsavel:''},filters:defaults(),excluded:[],manual:[],q:'',sort:'BRINCO',desc:false,page:1,onlyAttention:false,activity:'AVALIACAO',groupName:'Avaliação reprodutiva · seleção livre',destination:'EXISTENTE',save:false,savedName:'',included:false,feedback:'',showSaved:false};
try{const ctx=JSON.parse(sessionStorage.getItem('fazendinha:mockup:entrada-contexto')||'null');if(ctx&&typeof ctx.nome==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(ctx.date)&&Number.isFinite(Date.parse(ctx.date+'T12:00:00Z'))){state.entry={nome:ctx.nome,date:ctx.date,responsavel:typeof ctx.responsavel==='string'?ctx.responsavel:''};state.filters.date=ctx.date;}}catch{}
let saved=[];try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))saved=raw.filter(x=>x&&typeof x.nome==='string'&&x.filters&&typeof x.filters==='object');}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const check=(v)=>v?'checked':'';
const val=(f,k)=>esc(f[k]);
const scope=()=>animals.map(a=>context(a,state.filters.date)).filter(a=>a.nascimento<=state.filters.date);
function inRange(v,min,max){return (min===''&&max==='')||(v!=null&&(min===''||v>=Number(min))&&(max===''||v<=Number(max)));}
function matches(a,f){
 if(!f.lotes.includes(a.lote)||!f.categorias.includes(a.categoria)||!f.sexos.includes(a.sexo)||!f.papeis.includes(a.papel)||!f.producao.includes(a.producao)||!f.racas.includes(a.raca)||!f.situacoes.includes(a.situacao))return false;
 if(f.descarte!=='TODOS'&&a.descarte!==(f.descarte==='SIM'))return false;
 if(f.rp==='DESCONHECIDO'&&a.rp!==null)return false;
 if(['SIM','NAO'].includes(f.rp)&&a.rp!==(f.rp==='SIM'))return false;
 if(f.origem!=='TODOS'&&a.origem!==f.origem)return false;
 if(f.excludeProtocol&&a.protocolado)return false;
 if(f.busca&&!`${a.brinco} ${a.nome}`.toLocaleLowerCase('pt-BR').includes(f.busca.toLocaleLowerCase('pt-BR')))return false;
 if(!inRange(a.del,f.delMin,f.delMax)||!inRange(a.idadeMeses,f.idadeMin,f.idadeMax)||!inRange(a.peso,f.pesoMin,f.pesoMax)||!inRange(a.tentativas,f.tentativasMin,f.tentativasMax))return false;
 const any=f.vazias||f.tentativa||f.gestacao||f.novilhas||f.semParto;
 return !any||(f.vazias&&a.situacao==='VAZIA'&&a.diasParto!=null&&a.diasParto>f.vaziasMin)||(f.tentativa&&a.situacao==='AGUARDANDO_DIAGNOSTICO'&&a.diasTentativa!=null&&a.diasTentativa>f.tentativaMin)||(f.gestacao&&a.idadeGestacao!=null&&[[f.g1min,f.g1max],[f.g2min,f.g2max],[f.g3min,f.g3max]].some(([min,max])=>a.idadeGestacao>=min&&a.idadeGestacao<=max))||(f.novilhas&&a.categoria==='Novilha'&&a.situacao==='VAZIA'&&a.diasAptidao!=null&&a.diasAptidao>f.novilhasMin)||(f.semParto&&a.categoria==='Vaca'&&a.diasParto==null);
}
const candidates=()=>scope().filter(a=>matches(a,state.filters));
function pool(){const s=new Set(candidates().map(a=>a.id));state.manual.forEach(id=>s.add(id));return scope().filter(a=>s.has(a.id));}
const included=()=>pool().filter(a=>!state.excluded.includes(a.id));
function criteria(){const f=state.filters;let c=['Sítio Principal','Referência: '+fmt(f.date),'Lotes: '+(f.lotes.length===lots.length?'todos':f.lotes.join(', ')||'nenhum'),'Categorias: '+(f.categorias.join(', ')||'nenhuma'),'Sexo: '+(f.sexos.map(x=>labels[x]).join(', ')||'nenhum')];if(f.situacoes.length<4)c.push('Situação: '+f.situacoes.map(x=>labels[x]).join(', '));if(f.papeis.length<3)c.push('Papel: '+f.papeis.map(x=>labels[x]).join(', '));if(f.producao.length<3)c.push('Produção: '+f.producao.map(x=>labels[x]).join(', '));if(f.racas.length<3)c.push('Raças: '+f.racas.join(', '));if(f.descarte!=='TODOS')c.push('Descarte: '+f.descarte.toLowerCase());if(f.rp!=='TODOS')c.push('RP: '+(f.rp==='DESCONHECIDO'?'não informada':f.rp.toLowerCase()));if(f.origem!=='TODOS')c.push('Origem: '+f.origem.toLowerCase());if(f.excludeProtocol)c.push('Excluir animais em protocolo ativo');let rules=[];if(f.vazias)rules.push('vazias com mais de '+f.vaziasMin+' dias pós-parto');if(f.tentativa)rules.push('aguardando diagnóstico com mais de '+f.tentativaMin+' dias desde tentativa');if(f.gestacao)rules.push('gestantes em '+[[f.g1min,f.g1max],[f.g2min,f.g2max],[f.g3min,f.g3max]].map(([a,b])=>a+'–'+b).join(', ')+' dias');if(f.novilhas)rules.push('novilhas vazias com mais de '+f.novilhasMin+' dias após aptidão');if(f.semParto)rules.push('vacas sem histórico de parto');c.push(rules.length?'Incluir um destes grupos: '+rules.join(' OU '):'Sem condição de manejo adicional');for(const [k,label]of [['del','DEL'],['idade','Idade (meses)'],['peso','Último peso (kg)'],['tentativas','Tentativas no ciclo']])if(f[k+'Min']!==''||f[k+'Max']!=='')c.push(label+': '+(f[k+'Min']||'sem mínimo')+' a '+(f[k+'Max']||'sem máximo'));if(f.busca)c.push('Brinco/nome: '+f.busca);return c;}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4500);}
function footer(main,sub,buttons){document.getElementById('footer').innerHTML=`<div class="footer-inner"><div><strong>${main}</strong><small>${sub}</small></div><div class="actions">${buttons}</div></div>`;}

function entry(){
 footer('Escolha como montar esta visita','Os caminhos são independentes. Revisão e atendimento vêm depois.',`<button class="button primary" id="entry-button" type="submit" form="entry-form" ${state.entryMode?'':'disabled'}>${state.entryMode==='AGENDA'?'Continuar para a agenda':state.entryMode==='LIVRE'?'Continuar para os filtros':'Escolha um caminho'}</button>`);
 return `<div class="entry-shell"><div class="breadcrumbs"><span>Visitas veterinárias</span><span>/</span><span>Nova visita</span></div><div class="heading"><div><div class="eyebrow">Pecuária · Visitas</div><h1 id="page-title" tabindex="-1">Como deseja montar a visita?</h1><p class="subtitle">Use as demandas previstas do dia ou monte seu próprio grupo de animais.</p></div></div><form id="entry-form"><section class="panel"><div class="panel-header"><div><h2>Dados da visita</h2><p>Este contexto será usado no caminho escolhido.</p></div></div><div class="entry-context"><div class="form-grid"><label><span class="field-label">Nome da visita</span><input class="control" name="entryNome" required minlength="2" maxlength="120" value="${esc(state.entry.nome)}"></label><label><span class="field-label">Data da visita</span><input class="control" name="entryDate" type="date" min="2025-01-01" max="2027-12-31" required value="${state.entry.date}"></label><label><span class="field-label">Sítio</span><input class="control readonly-input" readonly value="Sítio Principal"></label><label><span class="field-label">Responsável (opcional)</span><input class="control" name="entryResponsavel" maxlength="120" value="${esc(state.entry.responsavel)}" placeholder="Nome do responsável pela visita"></label></div></div></section><h2 class="entry-heading" id="entry-choice-title">Escolha o caminho</h2><fieldset class="entry-choices" aria-labelledby="entry-choice-title"><label class="entry-choice"><input type="radio" name="entryMode" value="AGENDA" required ${check(state.entryMode==='AGENDA')}><span class="badge green">Demandas previstas</span><h2>Agenda do dia</h2><p>Veja o que está previsto para essa data e escolha os grupos que serão atendidos.</p><ul><li>Reprodução e Sanidade</li><li>Protocolos, etapas e retornos agendados</li><li>Revisão dos animais de cada grupo</li></ul></label><label class="entry-choice"><input type="radio" name="entryMode" value="LIVRE" required ${check(state.entryMode==='LIVRE')}><span class="badge gray">Grupo definido por você</span><h2>Seleção livre</h2><p>Use os filtros para escolher os animais e definir o atendimento que deseja realizar.</p><ul><li>Lotes, categorias e características</li><li>Faixas de manejo e ajustes manuais</li><li>Filtros salvos como atalhos opcionais</li></ul></label></fieldset><p class="entry-hint">Cada caminho tem suas próprias etapas de seleção. Depois de conferir os animais, você prepara a lista e segue para o atendimento.</p></form></div>`;
}

function heading(step,title,description,actions=''){return `<div class="breadcrumbs"><a href="#entrada" data-entry-link>Nova visita</a><span>/</span><span>Seleção livre</span></div><div class="heading"><div><div class="eyebrow">Seleção livre · Sítio Principal</div><h1 id="page-title" tabindex="-1">${title}</h1><p class="subtitle">${description}</p></div><div class="heading-actions"><button class="button" data-nav="entrada">Escolher outro caminho</button>${actions}</div></div><nav class="steps" aria-label="Etapas da seleção livre">${[['filtros','Filtros','Montar a seleção'],['revisao','Revisar animais','Conferir o grupo'],['atividade','Incluir na visita','Definir a atividade']].map(([id,t,sub],i)=>`<button class="step ${step===id?'active':''}" data-nav="${id}" ${id!=='filtros'&&!pool().length?'disabled':''} ${step===id?'aria-current="step"':''}><span class="number">${i+1}</span><span><strong>${t}</strong><small>${sub}</small></span></button>`).join('')}</nav>`;}
function picker(k,label,options){return `<div><span class="field-label">${label}</span><details class="choice" data-picker="${k}"><summary aria-label="${label}">${pickerText(k,options)}</summary><div class="choices">${options.map(([id,n])=>`<label class="check-label"><input type="checkbox" name="${k}" value="${id}" ${check(state.filters[k].includes(id))}>${n}</label>`).join('')}</div></details></div>`;}
function pickerText(k,o){const f=state.filters[k];return f.length===o.length?'Todos selecionados':f.length?o.filter(([id])=>f.includes(id)).map(([,n])=>n).join(', '):'Nenhum selecionado';}
function range(k,label){return `<label><span class="field-label">${label}</span><span class="range"><input class="control" name="${k}Min" type="number" min="0" step="1" value="${val(state.filters,k+'Min')}" placeholder="Mínimo" aria-label="${label}: mínimo"><span>a</span><input class="control" name="${k}Max" type="number" min="0" step="1" value="${val(state.filters,k+'Max')}" placeholder="Máximo" aria-label="${label}: máximo"></span></label>`;}
function rule(k,label,controls){return `<div class="rule"><label class="check-label"><input type="checkbox" name="${k}" ${check(state.filters[k])}>${label}</label><div class="rule-controls">${controls}</div></div>`;}
function number(k,label){return `<input type="number" name="${k}" value="${val(state.filters,k)}" min="0" max="10000" required aria-label="${label}">`;}
function select(k,label,options){return `<label><span class="field-label">${label}</span><select class="control" name="${k}">${options.map(([id,n])=>`<option value="${id}" ${state.filters[k]===id?'selected':''}>${n}</option>`).join('')}</select></label>`;}
function preview(){const list=candidates();return `<aside class="preview panel" aria-label="Prévia do grupo"><div class="panel-header"><h2>Prévia do grupo</h2><strong class="preview-count" id="preview-count">${list.length}</strong><p>animais atendem aos filtros</p><p class="note" id="preview-empty" ${list.length?'hidden':''}>Nenhum animal encontrado. Amplie os critérios para montar o grupo.</p></div><div class="preview-body"><p>A seleção combina os filtros gerais com <b>pelo menos um</b> dos grupos de manejo marcados.</p><dl id="preview-stats">${previewStats(list)}</dl><p class="note">Dados e limites ilustrativos. Você define os intervalos com o veterinário.</p><p class="note">Um grupo pode reunir animais de vários lotes. A seleção não altera o lote de nenhum animal.</p></div></aside>`;}
function previewStats(list){return ['VAZIA','AGUARDANDO_DIAGNOSTICO','GESTANTE'].map(k=>`<dt>${labels[k]}</dt><dd>${list.filter(a=>a.situacao===k).length}</dd>`).join('');}
function savedPanel(){return `<section class="panel saved-section"><div class="panel-header"><div><h2>Filtros salvos</h2><p>Atalhos opcionais. Os animais são consultados novamente para a data escolhida.</p></div></div>${saved.length?saved.map((s,i)=>`<div class="saved-row"><div><strong>${esc(s.nome)}</strong><small>Salvo nesta demonstração · sem lista fixa de animais</small></div><div class="actions"><button class="button small" data-preset="${i}">Usar filtros</button><button class="link-button" data-delete-preset="${i}">Remover</button></div></div>`).join(''):'<p class="preview-body">Nenhum filtro salvo ainda. Você poderá salvar os critérios ao incluir o grupo na visita.</p>'}</section>`;}
function filters(){const f=state.filters;let html=heading('filtros','Selecionar animais por filtros','Monte o grupo pelos seus critérios e confira os animais antes de definir a atividade.',`<button class="button" data-action="saved">${state.showSaved?'Fechar filtros salvos':'Usar filtros salvos'}</button>`);if(state.showSaved)html+=savedPanel();html+=`<div class="two-col"><form id="filters-form"><section class="panel"><div class="panel-header"><div><h2>Onde e quando procurar</h2><p>As informações são consideradas na data da visita.</p></div><span class="badge gray">1 · Contexto</span></div><div class="form-body"><div class="form-grid"><label><span class="field-label">Sítio</span><input class="control" value="Sítio Principal" readonly></label><label><span class="field-label">Data da visita</span><input class="control" type="date" name="date" readonly value="${f.date}" min="2025-01-01" max="2027-12-31" required></label>${picker('lotes','Lotes',lots.map(x=>[x,x]))}${picker('categorias','Categorias',['Vaca','Novilha','Macho'].map(x=>[x,x]))}</div></div></section><section class="panel"><div class="panel-header"><div><h2>Quais animais deseja avaliar?</h2><p>Inclua um ou mais grupos na mesma seleção.</p></div><span class="badge gray">2 · Manejo</span></div><div class="rule-head"><strong>Incluir quem atender a pelo menos uma condição abaixo</strong>As faixas são alternativas entre si. Lotes, categorias e demais filtros gerais continuam valendo para todos.</div>${rule('vazias','Vazias após o parto',`mais de ${number('vaziasMin','Dias pós-parto para vazias')} dias pós-parto`)}${rule('tentativa','Aguardando diagnóstico após tentativa',`mais de ${number('tentativaMin','Dias desde tentativa')} dias após IA, TE ou cobertura`)}${rule('gestacao','Gestantes nas faixas escolhidas',`<span>dias de gestação</span>`)}<div class="form-body" id="gestation-ranges" ${f.gestacao?'':'hidden'}><div class="form-grid three">${[1,2,3].map(n=>`<fieldset><legend>Faixa ${n}</legend><div class="rule-controls">${number('g'+n+'min','Gestação: mínimo da faixa '+n)}<span>a</span>${number('g'+n+'max','Gestação: máximo da faixa '+n)}<span>dias</span></div></fieldset>`).join('')}</div></div>${rule('novilhas','Novilhas vazias após aptidão',`mais de ${number('novilhasMin','Dias após aptidão das novilhas')} dias após aptidão`)}${rule('semParto','Vacas sem histórico de parto','<span>Histórico desconhecido não significa que nunca pariu.</span>')}<div class="form-body"><label class="check-label"><input type="checkbox" name="excludeProtocol" ${check(f.excludeProtocol)}>Desconsiderar animais em protocolo ativo</label><p class="note">Desmarque todas as condições de manejo para selecionar apenas pelas características gerais.</p></div></section><section class="panel"><div class="panel-header"><div><h2>Características do animal</h2><p>O animal precisa atender aos filtros gerais selecionados.</p></div><span class="badge gray">3 · Filtros gerais</span></div><div class="form-body"><div class="form-grid three">${picker('sexos','Sexo',['F','M'].map(k=>[k,labels[k]]))}${picker('papeis','Papel reprodutivo',['PADRAO','DOADORA','RECEPTORA'].map(k=>[k,labels[k]]))}${picker('producao','Situação produtiva',['LACTANTE','SECA','SEM_LACTACAO'].map(k=>[k,labels[k]]))}${picker('situacoes','Situação reprodutiva',['VAZIA','AGUARDANDO_DIAGNOSTICO','GESTANTE','DESCONHECIDA'].map(k=>[k,labels[k]]))}${select('descarte','Descarte reprodutivo',[['TODOS','Incluir todos'],['SIM','Somente descarte'],['NAO','Excluir descarte']])}</div></div><details class="advanced"><summary>Mais características · idade, raça, peso, RP e identificação</summary><div class="form-grid">${picker('racas','Raças',breeds.map(x=>[x,x]))}${select('origem','Origem',[['TODOS','Todas'],['NASCIMENTO','Nascimento na fazenda'],['COMPRA','Compra']])}${range('idade','Idade em meses')}${range('peso','Último peso conhecido (kg)')}${range('del','DEL')}${range('tentativas','Tentativas no ciclo')}${select('rp','Retenção de placenta no parto de referência',[['TODOS','Todas as situações'],['SIM','Sim'],['NAO','Não'],['DESCONHECIDO','Não informada']])}<label><span class="field-label">Brinco ou nome</span><input class="control" name="busca" value="${esc(f.busca)}" placeholder="Ex.: Aurora ou 042"></label></div><p class="note">Se uma medida exigida pelo filtro não estiver informada, o animal não entra automaticamente. Você poderá incluí-lo manualmente na revisão. RP desconhecida é diferente de “Não”.</p></details></section><div id="filter-error" class="error" role="alert" hidden></div><p class="note">Os intervalos iniciais foram usados para ilustrar a seleção do relatório. Não representam recomendação de manejo.</p></form>${preview()}</div><details class="flow-note"><summary>Como funciona a seleção livre</summary><p>Os animais desta lista vêm dos critérios que você definiu. Filtros salvos ficam neste caminho e são recalculados para a data da visita.</p><p>Você pode voltar à entrada para escolher a agenda. Essa troca não acrescenta demandas da agenda ao grupo livre.</p></details>`;footer('Seleção livre de animais','Filtros definidos pelo veterinário · referência em '+fmt(f.date),`<button class="link-button" data-action="clear">Limpar filtros</button><button class="button primary" form="filters-form" type="submit" id="review-button" ${candidates().length?'':'disabled'}>Revisar ${candidates().length} animais</button>`);return html;}
function readFilters(){const form=document.getElementById('filters-form');if(!form)return true;const fd=new FormData(form),f=structuredClone(state.filters);for(const k of ['lotes','categorias','sexos','papeis','producao','racas','situacoes'])f[k]=fd.getAll(k);for(const k of ['excludeProtocol','vazias','tentativa','gestacao','novilhas','semParto'])f[k]=fd.has(k);for(const k of ['date','descarte','rp','origem','busca'])f[k]=String(fd.get(k)||'');for(const k of ['vaziasMin','tentativaMin','novilhasMin','g1min','g1max','g2min','g2max','g3min','g3max'])f[k]=form.querySelector('[name="'+k+'"]').value===''?'':Number(form.querySelector('[name="'+k+'"]').value);for(const k of ['delMin','delMax','idadeMin','idadeMax','pesoMin','pesoMax','tentativasMin','tentativasMax'])f[k]=String(fd.get(k)||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date))return false;state.filters=f;document.getElementById('gestation-ranges').hidden=!f.gestacao;for(const [k,enabled]of Object.entries({vaziasMin:f.vazias,tentativaMin:f.tentativa,novilhasMin:f.novilhas,g1min:f.gestacao,g1max:f.gestacao,g2min:f.gestacao,g2max:f.gestacao,g3min:f.gestacao,g3max:f.gestacao}))form.querySelector('[name="'+k+'"]').disabled=!enabled;for(const k of ['lotes','categorias','sexos','papeis','producao','racas','situacoes']){const el=form.querySelector('[data-picker="'+k+'"] summary');if(el){const options=k==='lotes'?lots.map(x=>[x,x]):k==='racas'?breeds.map(x=>[x,x]):k==='categorias'?['Vaca','Novilha','Macho'].map(x=>[x,x]):(k==='sexos'?['F','M']:k==='papeis'?['PADRAO','DOADORA','RECEPTORA']:k==='situacoes'?['VAZIA','AGUARDANDO_DIAGNOSTICO','GESTANTE','DESCONHECIDA']:['LACTANTE','SECA','SEM_LACTACAO']).map(x=>[x,labels[x]]);el.textContent=pickerText(k,options);}}
 const list=candidates();document.getElementById('preview-count').textContent=list.length;document.getElementById('preview-empty').hidden=list.length>0;document.getElementById('preview-stats').innerHTML=previewStats(list);const btn=document.getElementById('review-button');btn.textContent='Revisar '+list.length+' animais';btn.disabled=!list.length;return true;}
function validFilters(){const f=state.filters;for(const k of ['del','idade','peso','tentativas'])if(f[k+'Min']!==''&&f[k+'Max']!==''&&Number(f[k+'Min'])>Number(f[k+'Max']))return 'O mínimo não pode ser maior que o máximo. Revise a faixa de '+({del:'DEL',idade:'idade',peso:'peso',tentativas:'tentativas'}[k])+'.';if(f.gestacao)for(const n of [1,2,3])if(f['g'+n+'min']===''||f['g'+n+'max']===''||f['g'+n+'min']>f['g'+n+'max'])return 'Revise os limites da faixa '+n+' de gestação.';return null;}
function visible(){let list=pool().filter(a=>(!state.q||`${a.brinco} ${a.nome} ${a.lote}`.toLocaleLowerCase('pt-BR').includes(state.q.toLocaleLowerCase('pt-BR')))&&(!state.onlyAttention||a.outraVisita));const field={BRINCO:'brinco',DEL:'del',TENTATIVA:'diasTentativa'}[state.sort];return list.sort((a,b)=>{const av=a[field],bv=b[field];if(av==null||bv==null)return av==null?(bv==null?0:1):-1;const x=typeof av==='number'?av-bv:String(av).localeCompare(String(bv),'pt-BR',{numeric:true});return state.desc?-x:x;});}
function table(list,readOnly=false){return `<div class="table-wrap" role="region" aria-label="Animais da seleção livre" tabindex="0"><table><caption class="sr-only">Animais na data ${fmt(state.filters.date)}</caption><thead><tr><th class="checkcol"><span class="sr-only">Incluir</span></th><th class="animalcol"><button class="sort" data-sort="BRINCO">Animal${state.sort==='BRINCO'?' '+(state.desc?'↓':'↑'):''}</button></th><th>Lote</th><th>Categoria</th><th>Situação</th><th class="numeric"><button class="sort" data-sort="DEL">DEL</button></th><th class="numeric">Tentativas</th><th class="numeric"><button class="sort" data-sort="TENTATIVA">Dias desde IA/TE/cobertura</button></th><th class="numeric">Partos</th><th>RP</th><th>Atenção</th></tr></thead><tbody>${list.map(a=>`<tr class="${state.excluded.includes(a.id)?'excluded':''}"><td class="checkcol"><input type="checkbox" data-animal="${a.id}" ${readOnly?'disabled':''} ${check(!state.excluded.includes(a.id))} aria-label="Incluir ${a.brinco}"></td><td class="animalcol"><b class="brinco">${a.brinco}</b><span class="animal-name">${esc(a.nome)}</span></td><td>${a.lote}</td><td>${a.categoria}</td><td><span class="badge ${a.situacao==='GESTANTE'?'green':a.situacao==='AGUARDANDO_DIAGNOSTICO'?'blue':'gray'}">${labels[a.situacao]}</span></td><td class="numeric">${a.producao==='SECA'?'Seca':a.del??'—'}</td><td class="numeric">${a.tentativas}</td><td class="numeric">${a.diasTentativa??'—'}</td><td class="numeric">${a.partos}</td><td>${a.rp===null?'—':a.rp?'Sim':'Não'}</td><td>${state.manual.includes(a.id)?'<span class="badge gray">Inclusão manual</span>':a.outraVisita?'<span class="badge amber">Outra visita aberta</span>':'—'}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">Nenhum animal encontrado com essa busca.</div>':''}</div>`;}
function review(){let list=visible(),pages=Math.max(1,Math.ceil(list.length/15));state.page=Math.min(state.page,pages);const page=list.slice((state.page-1)*15,state.page*15),includedIds=new Set(included().map(a=>a.id));let html=heading('revisao','Revisar animais','Confira os dados e retire quem ficará fora deste atendimento.',`<button class="button" data-nav="filtros">Ajustar filtros</button>`);html+=`<section class="panel"><div class="panel-header"><div><h2>Grupo montado por filtros</h2><p>${pool().length} animais na lista · ${includedIds.size} incluídos · ${state.manual.filter(id=>includedIds.has(id)).length} inclusões manuais</p></div><span class="badge green">Dados em ${fmt(state.filters.date)}</span></div><div class="criteria"><span class="criteria-title">Filtros usados nesta seleção</span>${criteria().map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>${pool().some(a=>a.outraVisita)?`<div class="notice"><span><strong>${pool().filter(a=>a.outraVisita).length} animais em outra visita aberta.</strong> Confira se há necessidade de outro atendimento.</span><button class="link-button" data-action="attention">${state.onlyAttention?'Mostrar todos':'Ver esses animais'}</button></div>`:''}<div class="toolbar"><label class="field">Buscar<input id="review-search" class="control" style="width:230px" value="${esc(state.q)}" placeholder="Brinco, nome ou lote"></label><button class="link-button" data-action="include-filtered">Incluir filtrados</button><button class="link-button" data-action="exclude-filtered">Excluir filtrados</button><div class="right"><span class="count-hint">${pool().length-includedIds.size} excluídos</span><span class="count-hint">Deslize para ver mais colunas</span></div></div>${table(page)}<div class="pagination"><span>${list.length?((state.page-1)*15+1)+'–'+Math.min(state.page*15,list.length):'0'} de ${list.length} animais · 15 por página</span><div class="pages"><button class="button small" data-page="${state.page-1}" ${state.page===1?'disabled':''}>Anterior</button><span>${state.page} / ${pages}</span><button class="button small" data-page="${state.page+1}" ${state.page===pages?'disabled':''}>Próxima</button></div></div><div class="notice soft">RP = retenção de placenta. “—” = não informado. “Seca” não equivale a DEL zero.</div><details class="manual-area" id="manual"><summary>Incluir animal fora dos filtros</summary><p class="note">Inclusão pontual neste grupo. Os critérios salvos continuam os mesmos.</p><label class="field">Buscar no sítio<input id="manual-search" class="control" style="max-width:300px" placeholder="Brinco ou nome" value="${esc(state.manualQuery||'')}"></label><div id="manual-items" class="manual-items">${manualItems()}</div></details></section>`;footer(includedIds.size+' animais incluídos neste grupo','Conferir o grupo não registra exames nem inicia protocolos.',`<button class="button" data-nav="filtros">Voltar aos filtros</button><button class="button primary" data-nav="atividade" ${includedIds.size?'':'disabled'}>Definir atividade e visita</button>`);return html;}
function manualItems(){const ids=new Set(pool().map(a=>a.id)),q=(state.manualQuery||'').toLocaleLowerCase('pt-BR');const list=scope().filter(a=>!ids.has(a.id)&&(!q||`${a.brinco} ${a.nome}`.toLocaleLowerCase('pt-BR').includes(q)));return list.slice(0,12).map(a=>`<div class="manual-item"><span><b>${a.brinco} · ${esc(a.nome)}</b><small class="note"> · ${a.lote} · ${labels[a.situacao]}</small></span><button class="button small" data-manual="${a.id}">Incluir</button></div>`).join('')||'<p class="note">Nenhum outro animal encontrado no sítio.</p>';}
const activityNames={AVALIACAO:'Avaliação reprodutiva',EXAME:'Exame sanitário',APLICACAO:'Aplicação sanitária',PROTOCOLO:'Iniciar protocolo'};
function activity(){if(!included().length){navigate('revisao');return '';}let html=heading('atividade','Incluir grupo na visita','Dê um nome ao grupo e escolha o que será feito. O atendimento vem depois.',`<button class="button" data-nav="revisao">Rever animais</button>`);html+=`<div class="two-col"><form id="activity-form"><section class="panel"><div class="panel-header"><div><h2>O que será feito neste grupo?</h2><p>Os mesmos filtros podem servir a atividades diferentes.</p></div></div><div class="form-body"><label><span class="field-label">Nome do grupo</span><input class="control" name="groupName" required maxlength="120" value="${esc(state.groupName)}"></label><fieldset class="activity-choices"><legend>Atividade</legend>${[['AVALIACAO','Avaliar gestação, reconfirmar ou observar sexo fetal por animal.'],['EXAME','Preparar uma coleta ou exame para os animais selecionados.'],['APLICACAO','Organizar a aplicação; produto e execução são informados no atendimento.'],['PROTOCOLO','Escolher o protocolo; início efetivo será registrado no atendimento.']].map(([k,d])=>`<label class="activity-choice"><input type="radio" name="activity" value="${k}" ${check(state.activity===k)}><span><b>${activityNames[k]}</b><small>${d}</small></span></label>`).join('')}</fieldset><div id="activity-extra">${activityExtra()}</div><div id="activity-error" class="error" role="alert" hidden></div></div></section><section class="panel"><div class="panel-header"><div><h2>Visita selecionada</h2><p>Contexto definido na entrada deste fluxo.</p></div></div><div class="form-body"><dl class="summary-list"><dt>Visita</dt><dd>${esc(state.entry.nome)}</dd><dt>Sítio</dt><dd>Sítio Principal</dd><dt>Data</dt><dd>${fmt(state.filters.date)}</dd><dt>Responsável</dt><dd>${esc(state.entry.responsavel||'Não informado')}</dd><dt>Origem do grupo</dt><dd>Seleção livre</dd></dl></div></section><section class="panel"><div class="form-body"><label class="check-label"><input type="checkbox" name="save" ${check(state.save)}>Salvar estes filtros para usar novamente</label><div id="save-preset" ${state.save?'':'hidden'}><label><span class="field-label">Nome do filtro salvo</span><input class="control" name="savedName" maxlength="120" value="${esc(state.savedName)}" placeholder="Ex.: Seleção de rotina do veterinário"></label><p class="note">Salva os critérios. Inclusões e exclusões manuais pertencem apenas a este grupo.</p></div></div></section></form><aside class="preview panel"><div class="panel-header"><h2>Resumo da inclusão</h2><strong class="preview-count">${included().length}</strong><p>animais neste grupo</p></div><div class="preview-body"><dl><dt>Origem</dt><dd>Seleção livre</dd><dt>Data</dt><dd>${fmt(state.filters.date)}</dd><dt>Lotes envolvidos</dt><dd>${new Set(included().map(a=>a.lote)).size}</dd><dt>Inclusões manuais</dt><dd>${included().filter(a=>state.manual.includes(a.id)).length}</dd></dl><p class="note">Os filtros e a lista serão preservados para consulta e impressão.</p></div></aside></div>`;footer(included().length+' animais prontos para inclusão','Incluir prepara a lista. Nenhum procedimento é executado nesta etapa.',`<button class="button" data-nav="revisao">Rever animais</button><button class="button primary" type="submit" form="activity-form">Incluir grupo na visita</button>`);return html;}
function activityExtra(){return state.activity==='PROTOCOLO'?'<label><span class="field-label">Protocolo</span><select class="control" id="protocol" required><option value="">Escolher protocolo</option><option>IATF · protocolo demonstrativo</option><option>Sanitário · acompanhamento demonstrativo</option></select></label>':state.activity==='EXAME'?'<label><span class="field-label">Tipo de exame</span><select class="control" id="exam" required><option value="">Escolher exame</option><option>Exame clínico demonstrativo</option><option>Coleta laboratorial demonstrativa</option></select></label>':'';}
function finish(){if(!state.included){navigate('filtros');return '';}const list=included();let html=heading('atividade','Grupo incluído na visita','A lista deste atendimento foi preparada a partir dos filtros e da revisão dos animais.',`<button class="button" data-action="print">Imprimir ficha do grupo</button>`);html+=`<div class="success" role="status"><h2>${list.length} animais incluídos na demonstração</h2><p>${esc(state.groupName)} · ${activityNames[state.activity]} · ${fmt(state.filters.date)}</p><p class="note">Esta é uma simulação de preparação. Nenhum animal, estoque, exame ou protocolo do app foi alterado.</p></div><section class="panel"><div class="panel-header"><div><h2>Grupos da visita</h2><p>${esc(state.visitName)} · Sítio Principal</p></div></div><div class="table-wrap"><table class="result-table" style="min-width:750px"><thead><tr><th>Grupo</th><th>Origem</th><th>Atividade</th><th>Animais</th><th>Estado</th></tr></thead><tbody><tr><td>${esc(state.groupName)}</td><td><span class="badge green">Seleção livre</span></td><td>${activityNames[state.activity]}</td><td>${list.length}</td><td>A atender</td></tr></tbody></table></div><div class="notice soft">A lista conserva os critérios e as inclusões manuais deste grupo. Confira os resultados por animal no atendimento.</div></section><section class="panel"><div class="panel-header"><div><h2>Lista preparada pela seleção livre</h2><p>A impressão inclui os critérios, a data e as inclusões manuais.</p></div></div><div class="criteria"><span class="criteria-title">Filtros da seleção</span>${criteria().map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>${table(list,true)}</section><details class="flow-note"><summary>Passagem para o atendimento</summary><p>A visita preparada segue para o atendimento já discutido: atividade por grupo, resultado por animal, detalhes quando necessários e conferência antes de confirmar. O resultado nunca é preenchido pelos filtros.</p><p class="note">Este percurso demonstra a seleção e a preparação do grupo. A tela operacional de atendimento permanece compartilhada, com resultado por animal e conferência antes de confirmar.</p></details><details class="flow-note feedback"><summary>Anotar pontos para discutirmos</summary><label for="feedback">O que manter, simplificar ou acrescentar?</label><textarea id="feedback" class="control" placeholder="Ex.: novos filtros, forma de combinar as faixas, nomes das ações...">${esc(state.feedback)}</textarea><button class="button small" data-action="export">Exportar grupo e observações (.json)</button></details>`;footer('Lista preparada · atendimento ainda não realizado','Você pode montar outro grupo sem usar o planner.',`<button class="button" data-action="export">Exportar seleção</button><button class="button primary" data-action="new-group">Montar outro grupo</button>`);return html;}
function route(){return ['entrada','filtros','revisao','atividade','visita'].includes(location.hash.slice(1))?location.hash.slice(1):'entrada';}
function navigate(page){state.page=1;state.q='';state.onlyAttention=false;const hash='#'+page;if(location.hash===hash)render(true);else location.hash=hash;}
function render(focus=false){const page=route();if(page!=='entrada'&&!state.entryConfirmed){navigate('entrada');return;}if(page==='visita'&&!state.included){navigate('filtros');return;}document.getElementById('app').innerHTML=page==='entrada'?entry():page==='filtros'?filters():page==='revisao'?review():page==='atividade'?activity():finish();if(focus){window.scrollTo(0,0);document.getElementById('page-title')?.focus({preventScroll:true});}}
document.addEventListener('submit',e=>{if(e.target.id==='filters-form'){e.preventDefault();if(!readFilters())return;const error=validFilters();if(error){const el=document.getElementById('filter-error');el.textContent=error;el.hidden=false;el.scrollIntoView({block:'center'});return;}state.included=false;navigate('revisao');}if(e.target.id==='activity-form'){e.preventDefault();const fd=new FormData(e.target);state.groupName=String(fd.get('groupName')).trim();state.activity=String(fd.get('activity'));state.destination='NOVA';state.save=fd.has('save');state.savedName=String(fd.get('savedName')||'').trim();const male=included().some(a=>a.sexo!=='F');let error=state.groupName.length<2?'Dê um nome ao grupo.':state.activity==='AVALIACAO'&&male?'A seleção contém machos. Revise os animais ou escolha uma atividade compatível.':state.save&&state.savedName.length<2?'Dê um nome ao filtro que deseja salvar.':null;if(error){const el=document.getElementById('activity-error');el.textContent=error;el.hidden=false;el.scrollIntoView({block:'center'});return;}state.visitName=state.entry.nome;if(!state.visitName){toast('Informe o nome da visita.');return;}if(state.save){saved.push({id:Date.now(),nome:state.savedName,filters:structuredClone(state.filters)});try{localStorage.setItem(KEY,JSON.stringify(saved));}catch{toast('Filtro disponível nesta sessão; armazenamento do navegador indisponível.');}}state.activityComplement=document.getElementById('protocol')?.value||document.getElementById('exam')?.value||'';state.included=true;navigate('visita');}});
document.addEventListener('input',e=>{const t=e.target;if(t.closest('#filters-form'))readFilters();if(t.id==='review-search'){const pos=t.selectionStart;state.q=t.value;state.page=1;render();const input=document.getElementById('review-search');input.focus();input.setSelectionRange(pos,pos);}if(t.id==='manual-search'){state.manualQuery=t.value;document.getElementById('manual-items').innerHTML=manualItems();}if(t.id==='feedback')state.feedback=t.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.closest('#filters-form'))readFilters();if(t.dataset.animal){state.excluded=t.checked?state.excluded.filter(id=>id!==t.dataset.animal):[...new Set([...state.excluded,t.dataset.animal])];render();}if(t.name==='activity'){const fd=new FormData(document.getElementById('activity-form'));state.groupName=String(fd.get('groupName'));state.activity=t.value;document.getElementById('activity-extra').innerHTML=activityExtra();}if(t.name==='destination'){state.destination=t.value;document.getElementById('new-visit').hidden=t.value!=='NOVA';}if(t.name==='save'){state.save=t.checked;document.getElementById('save-preset').hidden=!t.checked;document.querySelector('[name="savedName"]').required=t.checked;}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){if(route()==='filtros'&&['revisao','atividade'].includes(b.dataset.nav)){document.getElementById('filters-form').requestSubmit();if(b.dataset.nav==='atividade'&&!validFilters()&&included().length)navigate('atividade');return;}if(route()==='atividade'){const fd=new FormData(document.getElementById('activity-form'));state.groupName=String(fd.get('groupName'));state.savedName=String(fd.get('savedName')||'');}navigate(b.dataset.nav);}if(b.id==='reset'){if(!confirm('Reiniciar os filtros, a seleção e as anotações desta demonstração? Os filtros salvos serão mantidos.'))return;location.hash='entrada';Object.assign(state,{entryMode:null,entryConfirmed:false,entry:{nome:'Visita veterinária',date:BASE,responsavel:''},filters:defaults(),excluded:[],manual:[],q:'',page:1,included:false,feedback:'',showSaved:false,save:false,savedName:'',activity:'AVALIACAO',groupName:'Avaliação reprodutiva · seleção livre'});render(true);}if(b.dataset.action==='saved'){state.showSaved=!state.showSaved;render();}if(b.dataset.action==='clear'){state.filters={...defaults(),vazias:false,tentativa:false,gestacao:false,novilhas:false,semParto:false,excludeProtocol:false,sexos:['F','M'],categorias:['Vaca','Novilha','Macho']};state.excluded=[];state.manual=[];render();toast('Filtros limpos. Ajuste as características para montar seu grupo.');}if(b.dataset.preset){const p=saved[Number(b.dataset.preset)];state.filters={...defaults(),...structuredClone(p.filters),date:state.filters.date};state.excluded=[];state.manual=[];state.showSaved=false;render();toast('Critérios carregados. A data desta visita foi mantida.');}if(b.dataset.deletePreset){saved.splice(Number(b.dataset.deletePreset),1);try{localStorage.setItem(KEY,JSON.stringify(saved));}catch{}render();}if(b.dataset.page){state.page=Number(b.dataset.page);render();document.querySelector('.table-wrap')?.scrollIntoView({block:'nearest'});}if(b.dataset.sort){if(state.sort===b.dataset.sort)state.desc=!state.desc;else{state.sort=b.dataset.sort;state.desc=false;}render();}if(b.dataset.manual){state.manual.push(b.dataset.manual);state.excluded=state.excluded.filter(id=>id!==b.dataset.manual);render();document.getElementById('manual').open=true;toast('Animal incluído manualmente neste grupo.');}if(b.dataset.action==='attention'){state.onlyAttention=!state.onlyAttention;state.page=1;render();}if(['include-filtered','exclude-filtered'].includes(b.dataset.action)){const ids=visible().map(a=>a.id);state.excluded=b.dataset.action==='include-filtered'?state.excluded.filter(id=>!ids.includes(id)):[...new Set([...state.excluded,...ids])];render();}if(b.dataset.action==='print')window.print();if(b.dataset.action==='export'){const data={tipo:'proposta-selecao-livre',versao:1,dadosFicticios:true,data:state.filters.date,criterios:state.filters,descricaoFiltros:criteria(),grupo:state.groupName,atividade:activityNames[state.activity],complemento:state.activityComplement||null,inclusoesManuais:state.manual,exclusoes:state.excluded,animais:included().map(a=>({brinco:a.brinco,nome:a.nome,lote:a.lote})),observacoes:state.feedback};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='proposta-selecao-livre.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Seleção exportada com dados fictícios.');}if(b.dataset.action==='new-group'){state.included=false;state.excluded=[];state.manual=[];state.save=false;navigate('filtros');}});

document.addEventListener('submit',e=>{
 if(e.target.id!=='entry-form')return;e.preventDefault();
 const f=new FormData(e.target),mode=String(f.get('entryMode')||'');if(!['AGENDA','LIVRE'].includes(mode))return;
 const nome=String(f.get('entryNome')||'').trim();if(nome.length<2){toast('Informe o nome da visita.');return;}
 state.entry={nome,date:String(f.get('entryDate')),responsavel:String(f.get('entryResponsavel')||'').trim()};state.entryMode=mode;
 try{sessionStorage.setItem('fazendinha:mockup:entrada-contexto',JSON.stringify(state.entry));}catch{}
 if(mode==='AGENDA'){const q=new URLSearchParams({data:state.entry.date,nome:state.entry.nome,responsavel:state.entry.responsavel});location.href='mockup-agenda-visitas.html?'+q+'#planejamento';return;}
 state.entryConfirmed=true;state.filters.date=state.entry.date;navigate('filtros');
});
document.addEventListener('change',e=>{if(e.target.name!=='entryMode')return;state.entryMode=e.target.value;const b=document.getElementById('entry-button');b.disabled=false;b.textContent=state.entryMode==='AGENDA'?'Continuar para a agenda':'Continuar para os filtros';});

window.addEventListener('hashchange',()=>render(true));render();
</script></body></html>
