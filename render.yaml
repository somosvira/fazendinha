services:
  - type: web
    name: terrano-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter rionovo-server exec prisma generate && pnpm --filter rionovo-server run build
    startCommand: pnpm --filter rionovo-server run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # URL direct (não-pooled) — reservada para migrations Prisma controladas.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Ponte de transição: se setada, vale como acesso de dono. Opcional — as
      # contas reais (Usuario/Sessao) já são o caminho principal.
      - key: SHARED_ACCESS_TOKEN
        sync: false
      # Bootstrap do dono: no primeiro boot com a tabela Usuario vazia, cria o
      # dono PENDENTE com este e-mail e loga o link de definir senha.
      - key: AUTH_BOOTSTRAP_EMAIL
        sync: false
      # Base absoluta dos links de convite/reset (ex.: https://app.terrano.com.br).
      - key: APP_BASE_URL
        sync: false
      # Assina links de download locais (STORAGE_DRIVER=local). Trocar em prod.
      - key: LOCAL_DOWNLOAD_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # OpenAI (chat/bot + IA dos módulos). Sem ela: chat 503 e IA em modo demo.
      - key: OPENAI_API_KEY
        sync: false
