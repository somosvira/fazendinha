services:
  - type: web
    name: terrano-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter rionovo-server exec prisma generate && pnpm --filter rionovo-server run build
    startCommand: pnpm --filter rionovo-server run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # URL direct (não-pooled) — reservada para migrations Prisma controladas.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Senha compartilhada do piloto — se setada, exige Authorization: Bearer <token>
      # em todas as rotas (exceto /health e /whatsapp). O client tem tela de login.
      - key: SHARED_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Recuperação pública de senha por e-mail (Resend).
      - key: APP_BASE_URL
        sync: false
      - key: AUTH_EMAIL_PROVIDER
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # OpenAI (chat/bot + IA dos módulos). Sem ela: chat 503 e IA em modo demo.
      - key: OPENAI_API_KEY
        sync: false
      # Opcional: role somente-leitura p/ o escape-hatch de SQL do bot.
      - key: DATABASE_URL_READONLY
        sync: false
